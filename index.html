<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENGEFIT</title>
<meta name="description" content="Registre treinos, acompanhe cargas e evolua com dados.">
<meta name="theme-color" content="#050912">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENGEFIT">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral com navegação + coluna única de trabalho; abas fixas no rodapé em telas estreitas. Estética de prancha técnica. */
:root{
  --bg:#050912; --surface:#0b1424; --surface2:#122038; --ink:#e8f3ff; --muted:#8ea3c2; --line:#1e3352; --grid:rgba(63,184,255,.06);
  --accent:#3fb8ff; --accent-ink:#041322; --blue:#7fd3ff; --good:#4ade80; --bad:#ff5c7a;
  --display:'Chakra Petch','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --tabh:60px; --side:224px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:rgba(63,184,255,.18)}
button,a,input,select,textarea,label,summary{touch-action:manipulation}
@media (pointer:fine){html{overscroll-behavior:none}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:22px}
h3{font-size:19px}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Estrutura */
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;z-index:5}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none}
.logo svg{width:44px;height:28px;color:var(--accent)}
.logo b{font-family:var(--display);font-size:28px;letter-spacing:.04em}
.logo b i{font-style:normal;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a svg{width:22px;height:22px;flex:none}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--surface)}
.side .foot{margin-top:auto;font:500 11px/1.4 var(--mono);color:var(--muted);padding:0 8px}
.main{margin-left:var(--side);flex:1;min-width:0;padding:0 24px 140px}
.wrap{max-width:860px;margin:0 auto}
.tabs{display:none}

/* Cabeçalho de página */
.ph{margin:0 -24px 22px;padding:calc(30px + env(safe-area-inset-top)) 24px 22px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border-bottom:1px solid var(--line)}
.ph .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* Componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.sec{margin-top:28px}
.sec>.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tag{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.lbl{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile b{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px;margin-bottom:12px}
input[type=text],input[type=search],input[type=date],input[type=password],input[type=email],input:not([type]),input[inputmode],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px}
select,option{background-color:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.note{font-size:13px;color:var(--muted)}

/* Feed */
.post{display:flex;flex-direction:column;gap:12px}
.post .who{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 16px var(--display);flex:none;border:1px solid var(--line)}
.av.me{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.post .who small{display:block;color:var(--muted);font-size:12px}
.pstats{display:flex;gap:22px;flex-wrap:wrap}
.pstats div{display:flex;flex-direction:column;gap:2px}
.pstats b{font:600 17px var(--mono)}
.plist{display:flex;flex-direction:column;gap:4px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.plist div{display:flex;justify-content:space-between;gap:12px}
.plist span:last-child{color:var(--muted);font-family:var(--mono);font-size:13px;white-space:nowrap}
.pact{display:flex;gap:8px;flex-wrap:wrap}

/* Treino ativo */
.wkhead{position:sticky;top:0;z-index:4;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.wname{font:700 26px var(--display);border:0;background:transparent;padding:4px 0;min-height:0;width:100%;border-radius:0;border-bottom:1px dashed var(--line)}
.wkstats{display:flex;gap:26px;margin:10px 0 12px;flex-wrap:wrap}
.wkstats div{display:flex;flex-direction:column;gap:3px}
.wkstats b{font:600 20px var(--mono)}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.excard header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.excard header h3{color:var(--blue)}
.exnote{border:0;background:transparent;padding:4px 0;min-height:0;font-size:14px;margin-bottom:6px;border-radius:0;border-bottom:1px dashed var(--line);width:100%}
.sethead,.set{display:grid;grid-template-columns:38px minmax(54px,1fr) minmax(0,1.1fr) minmax(0,1.1fr) 42px 28px;gap:8px;align-items:center}
.sethead{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 0 6px;text-align:center}
.set{padding:5px 0;border-radius:8px}
.set.done{background:color-mix(in srgb,var(--good) 14%,transparent)}
.set .prev{color:var(--muted);font-size:13px;text-align:center;white-space:nowrap}
.set input.num{text-align:center;font:600 16px var(--mono);padding:7px 4px;min-height:40px}
.stype{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font:600 14px var(--mono)}
.stype.t-W{color:#a96a00;border-color:#a96a00}
.stype.t-D{color:var(--blue);border-color:var(--blue)}
.stype.t-F{color:var(--bad);border-color:var(--bad)}
.chk{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:20px;height:20px}
.set.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.x{width:36px;height:36px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;border-radius:6px}
.x:hover{color:var(--bad);background:var(--surface2)}
.exmenu{display:flex;gap:2px}

/* Treinos */
.rt h3{margin-bottom:2px}
.rt p{color:var(--muted);font-size:14px}
.rt .meta{font:500 12px var(--mono);color:var(--muted);margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.folder{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.folder::after{content:"";flex:1;height:1px;background:var(--line)}

/* Exercícios */
.exlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.exitem{content-visibility:auto;contain-intrinsic-size:auto 72px;display:grid;grid-template-columns:56px 1fr auto;gap:2px 12px;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;align-items:center}
.exitem:last-child{border-bottom:0}
.exitem:hover{background:var(--surface2)}
.exitem .exname{font-weight:600}
.exitem .exmeta{color:var(--muted);font-size:13px;grid-column:2}
.exitem .exsess{grid-column:3;grid-row:1/3;color:var(--muted);font-size:12px;text-align:right}
.exitem.sel{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.filters{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:12px}

/* Gráficos */
svg.ch{width:100%;height:auto;display:block}
.ch .g{stroke:var(--line);stroke-width:1}
.ch .ln{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch .ar{fill:var(--accent);opacity:.13}
.ch .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch .tx{fill:var(--muted);font:11px var(--mono)}
.ch .tv{fill:var(--ink);font:600 12px var(--mono)}
.ch .bar{fill:var(--blue)}
.mrow{display:grid;grid-template-columns:100px 1fr 38px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.mrow .tr{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.mrow .tr i{display:block;height:100%;background:var(--blue);border-radius:5px}
.mrow b{font:600 13px var(--mono);text-align:right}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dw{font:500 11px var(--mono);color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:4px}
.cal button{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:500 14px var(--mono);position:relative;padding:0}
.cal button.has{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal button.sel{outline:2px solid var(--blue);outline-offset:1px}
.cal .blank{visibility:hidden}

/* Doca inferior, modal, toast */
#dock{position:fixed;left:var(--side);right:0;bottom:0;z-index:6;display:flex;flex-direction:column;gap:8px;padding:0 16px 12px;pointer-events:none}
#dock>*{pointer-events:auto;max-width:860px;width:100%;margin:0 auto}
.mini{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:600}
.mini .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
.mini b{margin-left:auto;font-family:var(--mono)}
.mini .go{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:4px 10px;font-size:13px}
@keyframes pulse{50%{opacity:.35}}
.restbar{background:var(--surface);border:1px solid var(--ink);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);position:relative;overflow:hidden}
.restbar[hidden]{display:none}
.restbar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.restbar .t{font:600 22px var(--mono);min-width:64px}
.restbar .sp{flex:1;font-size:13px;color:var(--muted)}
#modal{position:fixed;inset:0;z-index:20;display:none}
#modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,14,20,.55)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.rrow{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;margin-bottom:10px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.rin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rin label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.rin input{text-align:center;font-family:var(--mono);font-weight:600}
.pklist{max-height:46vh;overflow:auto;margin:12px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.lock{overflow:hidden}
.pr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.table th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.table td.n{font-family:var(--mono);text-align:right}
textarea.big{min-height:160px;font:12px/1.4 var(--mono)}

/* Tela de acesso */
body.authmode .app,body.authmode .tabs,body.authmode #dock{display:none}
#auth{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
#auth[hidden]{display:none}
.authbox{width:min(400px,100%);display:flex;flex-direction:column;gap:18px}
.authbox .logo{justify-content:center;padding:0}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.authcard h1{font-size:28px;margin-bottom:4px}
.authcard .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.pw{position:relative;display:block}
.pw input{padding-right:78px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:6px 8px}
.amsg{font-size:14px;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.amsg.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.amsg.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.alinks{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.linkbtn{border:0;background:none;padding:8px 2px;min-height:36px;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.authfoot{text-align:center;font:500 11px/1.5 var(--mono);color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font:500 11px/1.3 var(--mono);color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.sync[data-s="saving"] i,.sync[data-s="pending"] i{background:var(--blue)}
.sync[data-s="offline"] i,.sync[data-s="error"] i{background:var(--bad)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* Demonstrações ilustradas */
svg.thumb,.thumb-ph{width:56px;height:47px;background:var(--surface2);border-radius:8px;grid-row:1/3;grid-column:1}
.thumb-ph{display:grid;place-items:center;font:600 16px var(--display);color:var(--muted)}
.exitem .exname{grid-column:2}
svg.demo{width:100%;height:auto;display:block;max-height:300px;border-radius:8px}
.mdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}.mdot.p{background:#e0283f}.mdot.s{background:#f2788a}
.demo-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px;margin-bottom:10px}
.demo-ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 4px 2px}
.demo-frames{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.demo-frames figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.demo-frames figcaption{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:2px 0 4px}
.fig{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig.far{opacity:.3}
.fig-head{fill:var(--ink)}
.gnd{stroke:var(--line);stroke-dasharray:3 3}
.eq-b{fill:var(--surface2);stroke:var(--muted);stroke-width:1.2}
.eq-l{stroke:var(--muted);stroke-linecap:round}
.eq-pad{stroke:var(--line);stroke-linecap:round}
.eq-mat{fill:var(--surface2)}
.eq-c{stroke:var(--blue);stroke-width:1.4}
.eq-pul{fill:var(--surface);stroke:var(--blue);stroke-width:1.4}
.eq-plate,.eq-db{fill:var(--accent);stroke:var(--ink);stroke-width:1}
.eq-hub{fill:var(--surface)}
.eq-roll{fill:var(--surface2);stroke:var(--muted);stroke-width:1.2}
.libfilters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.libfilters .row select{width:auto;min-height:36px;padding:6px 10px}
#install{padding:12px 16px 0}
#install:empty{display:none}
body:not(.authmode) #install{margin-left:var(--side)}
.instbar{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px}
.instbar img{border-radius:10px;flex:none}
.instbar div{flex:1;min-width:0}
.instbar small{display:block;color:var(--muted);font-size:12px;line-height:1.35}

/* ====== Gráficos ====== */
function lineChart(pts,fmt){
  if(!pts.length)return '<p class="empty">Sem dados para este gráfico.</p>';
  var W=600,H=220,pl=48,pr=18,pt=22,pb=28;
  var mn=Math.min.apply(null,pts.map(function(p){return p.v;})),mx=Math.max.apply(null,pts.map(function(p){return p.v;}));
  if(mn===mx){mn-=1;mx+=1;}
  var p10=(mx-mn)*0.12;mn-=p10;mx+=p10;
  var X=function(i){return pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1));};
  var Y=function(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de linha com '+pts.length+' pontos">';
  for(var k=0;k<4;k++){var val=mn+(mx-mn)*k/3,y=Y(val);s+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="tx" x="'+(pl-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+fmt(val)+'</text>';}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' ');
  s+='<path class="ar" d="'+d+' L'+X(pts.length-1).toFixed(1)+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z"/><path class="ln" d="'+d+'"/>';
  var idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter(function(v,i,a){return a.indexOf(v)===i;});
  idx.forEach(function(i){s+='<text class="tx" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0&&pts.length>1?'start':i===pts.length-1&&pts.length>1?'end':'middle')+'">'+esc(pts[i].l)+'</text>';});
  var li=pts.length-1,ly=Y(pts[li].v);
  s+='<circle class="pt" cx="'+X(li).toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5"/><text class="tv" x="'+X(li).toFixed(1)+'" y="'+(ly<pt+8?ly+20:ly-10).toFixed(1)+'" text-anchor="end">'+fmt(pts[li].v)+'</text></svg>';
  return s;
}
function barChart(items){
  var W=600,H=190,pl=12,pr=12,pt=22,pb=28,n=items.length;
  var mx=Math.max.apply(null,items.map(function(i){return i.v;}).concat([1]));
  var slot=(W-pl-pr)/n,bw=Math.min(40,slot*0.6);
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de barras semanal"><line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  items.forEach(function(it,i){
    var h=(H-pt-pb)*it.v/mx,x=pl+slot*i+(slot-bw)/2,y=H-pb-h;
    if(it.v>0)s+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/><text class="tv" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+it.v+'</text>';
    if(n<=8||i%2===(n-1)%2)s+='<text class="tx" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(it.l)+'</text>';
  });
  return s+'</svg>';
}

/* ====== Modais ====== */
var stack=[];
function pushModal(m){stack.push(m);drawModal();}
function popModal(){stack.pop();drawModal();}
function drawModal(){
  var el=$('#modal');
  if(!stack.length){el.innerHTML='';el.classList.remove('open');document.body.classList.remove('lock');return;}
  var m=stack[stack.length-1];
  el.innerHTML='<div class="backdrop" data-act="modal-close" aria-hidden="true"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(m.title)+'" tabindex="-1">'+m.html()+'</div>';
  el.classList.add('open');document.body.classList.add('lock');
  if(m.mount)m.mount(el);
}
function confirmM(title,text,okLabel,fn,danger){
  pushModal({title:title,html:function(){return '<div class="sh-head"><h2>'+esc(title)+'</h2></div><p>'+esc(text)+'</p><div class="row end"><button class="btn ghost" data-act="modal-close">Cancelar</button><button class="btn '+(danger?'danger':'primary')+'" data-act="cf-ok">'+esc(okLabel)+'</button></div>';},act:function(a){if(a==='cf-ok'){popModal();fn();return true;}return false;}});
}
var tt;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},2600);}
function head(t){return '<div class="sh-head"><h2>'+esc(t)+'</h2><button class="x" data-act="modal-close" aria-label="Fechar">×</button></div>';}

/* ====== Lista de exercícios (compartilhada) ====== */
function exFilter(q,mu,eq,loc){q=norm(q||'');return allEx().filter(function(x){return (!mu||x.m===mu)&&(!eq||x.e===eq)&&(!loc||exLocal(x)===loc)&&(!q||norm(x.name).indexOf(q)>-1);}).sort(function(a,b){return a.name.localeCompare(b.name,'pt-BR');});}
function exItems(list,sel){
  var c=sessionCounts();
  if(!list.length)return '<p class="empty">Nenhum exercício encontrado. Ajuste a busca ou crie um exercício.</p>';
  return list.map(function(x){var n=c[x.id]||0;return '<button class="exitem'+(sel&&sel.has(x.id)?' sel':'')+'" data-act="'+(sel?'pk-toggle':'ex-open')+'" data-id="'+esc(x.id)+'">'+(DM.has(x.id)?DM.svg(x.id,1,'thumb'):'<span class="thumb-ph" aria-hidden="true">'+esc(x.name.charAt(0))+'</span>')+'<span class="exname">'+esc(x.name)+'</span><span class="exmeta">'+esc(x.m)+' · '+esc(x.e)+'</span><span class="exsess mono">'+(n?n+(n===1?' sessão':' sessões'):'—')+'</span></button>';}).join('');
}
function chipsL(cur,act){return [['','Todos os locais'],['casa','Em casa'],['academia','Academia']].map(function(o){return '<button class="'+(cur===o[0]?'on':'')+'" data-act="'+act+'" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('');}
function chipsM(cur,act){return '<button class="chip'+(cur===''?' on':'')+'" data-act="'+act+'" data-v="">Todos</button>'+MUSC.map(function(m){return '<button class="chip'+(cur===m?' on':'')+'" data-act="'+act+'" data-v="'+m+'">'+m+'</button>';}).join('');}

function openPicker(onDone){
  var q='',mu='',lo='',sel=new Set();
  function refresh(){
    $('#pklist').innerHTML=exItems(exFilter(q,mu,'',lo),sel);
    $('#pkloc').innerHTML=chipsL(lo,'pk-loc');
    $('#pkchips').innerHTML=chipsM(mu,'pk-mu');
    var b=$('#pkdone');b.textContent=sel.size?'Adicionar '+sel.size+(sel.size===1?' exercício':' exercícios'):'Selecione exercícios';b.disabled=!sel.size;b.style.opacity=sel.size?1:.5;
  }
  var m={title:'Adicionar exercício',
    html:function(){return head('Adicionar exercício')+'<input type="search" id="pq" placeholder="Buscar exercício…" aria-label="Buscar exercício" value="'+esc(q)+'"><div class="scroll-x" style="margin-top:10px"><div class="seg" id="pkloc"></div></div><div class="chips scroll-x" id="pkchips" style="margin-top:10px;flex-wrap:nowrap"></div><div class="exlist pklist" id="pklist"></div><div class="row end" style="margin-top:0"><button class="btn ghost sm" data-act="pk-new">Criar exercício</button><button class="btn primary" id="pkdone" data-act="pk-done">Selecione exercícios</button></div>';},
    mount:refresh,
    input:function(t){if(t.id==='pq'&&t.value!==q){q=t.value;refresh();}},
    act:function(a,el){
      if(a==='pk-toggle'){var id=el.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);refresh();return true;}
      if(a==='pk-mu'){mu=el.dataset.v;refresh();return true;}
      if(a==='pk-loc'){lo=el.dataset.v;refresh();return true;}
      if(a==='pk-new'){customEditor(function(){});return true;}
      if(a==='pk-done'){if(!sel.size)return true;var ids=Array.from(sel);popModal();onDone(ids);return true;}
      return false;
    }};
  pushModal(m);
}
function customEditor(after){
  var d={name:'',m:MUSC[0],e:EQUIP[0]};
  pushModal({title:'Criar exercício',
    html:function(){return head('Criar exercício')+'<label class="fl">Nome<input id="cn" data-b="name" value="'+esc(d.name)+'" placeholder="Ex.: Remada cavalinho"></label><label class="fl">Músculo principal<select data-b="m">'+MUSC.map(function(x){return '<option'+(x===d.m?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label><label class="fl">Equipamento<select data-b="e">'+EQUIP.map(function(x){return '<option'+(x===d.e?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label><div class="row end"><button class="btn ghost" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="cx-save">Salvar exercício</button></div>';},
    input:function(t){if(t.dataset.b)d[t.dataset.b]=t.value;},
    act:function(a){if(a==='cx-save'){if(!d.name.trim()){toast('Informe o nome do exercício.');return true;}S.custom.push({id:'c'+uid(),name:d.name.trim(),m:d.m,e:d.e});save();popModal();render();toast('Exercício criado.');after();return true;}return false;}});
}

/* ====== Detalhe do exercício ====== */
function exDetail(id){
  var x=exById(id),tab='how',met='top';
  pushModal({title:x.name,
    html:function(){
      var h=exHist(id),b='';
      var tabs='<div class="seg" style="margin-bottom:14px">'+[['how','Como fazer'],['res','Resumo'],['gra','Gráfico'],['his','Histórico']].map(function(t){return '<button data-act="ed-tab" data-v="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>';}).join('')+'</div>';
      if(tab==='how')b=howHTML(x);
      else if(!h.length)b='<p class="empty">Nenhum registro ainda. Faça este exercício em um treino para ver recordes e gráficos.</p>';
      else if(tab==='res'){
        var top=Math.max.apply(null,h.map(function(s){return s.top;})),r1=Math.max.apply(null,h.map(function(s){return s.rm;})),tv=h.reduce(function(a,s){return a+s.vol;},0);
        var recs={};h.forEach(function(s){s.sets.forEach(function(st){if(st.t!=='W'&&st.reps>0&&(!recs[st.reps]||st.kg>recs[st.reps]))recs[st.reps]=st.kg;});});
        var rr=[1,3,5,8,10,12,15].filter(function(n){return recs[n]!=null;});
        b='<div class="kv"><div class="tile"><span class="lbl">Maior carga</span><b>'+fmtW(top)+'</b></div><div class="tile"><span class="lbl">1RM estimado</span><b>'+fmtW(r1)+'</b></div><div class="tile"><span class="lbl">Sessões</span><b>'+h.length+'</b></div><div class="tile"><span class="lbl">Volume total</span><b>'+fmtVol(tv)+'</b></div></div>'+
        (rr.length?'<table class="table"><thead><tr><th>Repetições</th><th style="text-align:right">Melhor carga</th></tr></thead><tbody>'+rr.map(function(n){return '<tr><td>'+n+' rep'+(n>1?'s':'')+'</td><td class="n">'+fmtW(recs[n])+'</td></tr>';}).join('')+'</tbody></table>':'');
      }else if(tab==='gra'){
        var labs={top:'Carga máxima',rm:'1RM estimado',vol:'Volume da sessão'};
        var pts=h.map(function(s){var dd=new Date(s.w.start);return {l:pad(dd.getDate())+'/'+pad(dd.getMonth()+1),v:conv(s[met])};});
        b='<div class="seg" style="margin-bottom:10px">'+Object.keys(labs).map(function(k){return '<button data-act="ed-met" data-v="'+k+'" class="'+(met===k?'on':'')+'">'+labs[k]+'</button>';}).join('')+'</div>'+lineChart(pts,function(v){return met==='vol'?num(v,0):num(v,1);})+'<p class="note">Valores em '+unit()+(met==='rm'?'. Estimativa pela fórmula de Epley.':'.')+'</p>';
      }else{
        b=h.slice().reverse().slice(0,30).map(function(s){return '<div class="pr"><span>'+fmtDate(s.w.start)+'</span><span class="mono" style="font-size:13px;text-align:right">'+s.sets.map(function(st){return (st.t==='W'?'W ':'')+dispKg(st.kg)+'×'+st.reps;}).join(' · ')+'</span></div>';}).join('');
      }
      return head(x.name)+'<p class="note" style="margin:-8px 0 14px">'+esc(x.m)+' · '+esc(x.e)+' · '+(exLocal(x)==='casa'?'Dá para fazer em casa':'Academia')+'</p>'+tabs+b;
    },
    mount:function(){if(tab==='how')startDemo(id);else stopDemo();},
    act:function(a,el){if(a==='ed-tab'){tab=el.dataset.v;drawModal();return true;}if(a==='ed-met'){met=el.dataset.v;drawModal();return true;}return false;}});
}

/* ====== Demonstração animada ====== */
var demoA={raf:0,id:null,paused:false,t0:0,last:0,at:0};
function stopDemo(){if(demoA.raf)cancelAnimationFrame(demoA.raf);demoA.raf=0;}
function demoU(ms){var p=(ms%3600)/3600,e=function(v){return 0.5-0.5*Math.cos(Math.PI*v);};return p<.12?0:p<.45?e((p-.12)/.33):p<.62?1:p<.95?1-e((p-.62)/.33):0;}
function demoLoop(now){
  demoA.raf=requestAnimationFrame(demoLoop);
  var el=document.getElementById('demo-anim');if(!el){stopDemo();return;}
  if(demoA.paused||now-demoA.last<33)return;demoA.last=now;
  el.innerHTML=DM.svg(demoA.id,demoU(now-demoA.t0),'demo');
}
function startDemo(id){
  stopDemo();if(!DM.has(id))return;demoA.id=id;demoA.t0=performance.now();
  var rm=false;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  demoA.paused=rm;updDemoBtn();demoA.raf=requestAnimationFrame(demoLoop);
}
function updDemoBtn(){var b=$('#demo-btn');if(b){b.textContent=demoA.paused?'Animar':'Pausar';b.setAttribute('aria-pressed',String(!demoA.paused));}}
function howHTML(x){
  var st=DM.steps(x.id),yt='https://www.youtube.com/results?search_query='+encodeURIComponent('como fazer '+x.name.replace(/\s*\(.*\)\s*/g,' ').trim());
  var h='';
  if(DM.has(x.id)){
    h+='<div class="demo-box"><div id="demo-anim">'+DM.svg(x.id,0,'demo')+'</div><div class="demo-ctl"><span class="lbl">Demonstração ilustrada</span><button class="btn sm ghost" id="demo-btn" data-act="demo-toggle" aria-pressed="true">Pausar</button></div></div>';
    h+='<div class="demo-frames"><figure>'+DM.svg(x.id,0,'demo')+'<figcaption>Início</figcaption></figure><figure>'+DM.svg(x.id,1,'demo')+'<figcaption>Fim</figcaption></figure></div>';
    var mu=DM.muscles&&DM.muscles(x.id);
    if(mu)h+='<div class="card musc" style="margin-bottom:14px"><div class="lbl" style="margin-bottom:8px">Músculos trabalhados</div><p style="margin:0 0 6px"><span class="mdot p" aria-hidden="true"></span><b>Principal:</b> '+esc(mu.p.join(', '))+'</p>'+(mu.s.length?'<p style="margin:0"><span class="mdot s" aria-hidden="true"></span><b>Auxiliares:</b> '+esc(mu.s.join(', '))+'</p>':'')+'</div>';
  }else h+='<div class="card" style="margin-bottom:14px"><p class="note">Exercício criado por você: ainda sem demonstração ilustrada.</p></div>';
  if(st)h+='<h3 style="margin-bottom:8px">Passo a passo</h3><ol class="isteps">'+st.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ol>';
  h+='<div class="row" style="margin-top:4px"><a class="btn sm" href="'+yt+'" target="_blank" rel="noopener">Ver vídeos no YouTube</a></div><p class="note" style="margin-top:8px">Os vídeos abrem no YouTube, de outros criadores. Na dúvida sobre a execução, peça orientação a um profissional de educação física.</p>';
  return h;
}

/* ====== Treino ativo ====== */
function elapsed(){return S.active?Math.floor((Date.now()-S.active.start)/1000):0;}
function startWorkout(rt){
  if(S.active){toast('Finalize ou descarte o treino atual primeiro.');go('treino');return;}
  var hr=new Date().getHours(),per=hr<12?'da manhã':hr<18?'da tarde':'da noite';
  var A={id:uid(),name:rt?rt.name:'Treino '+per,start:Date.now(),rid:rt?rt.id:null,exs:[]};
  if(rt)rt.exs.forEach(function(r){var sets=[];for(var i=0;i<r.n;i++)sets.push({t:'N',kg:r.kg==null?null:r.kg,reps:r.reps==null?null:r.reps,done:false});A.exs.push({ex:r.ex,note:'',sets:sets});});
  S.active=A;save();go('treino');
}
function addExToActive(ids){ids.forEach(function(id){var ps=prevSets(id);S.active.exs.push({ex:id,note:'',sets:[{t:'N',kg:null,reps:null,done:false}]});});save();render();}
function totalsActive(){var v=0,n=0;S.active.exs.forEach(function(e){e.sets.forEach(function(s){if(s.done){n++;v+=setVol(s);}});});return {vol:v,sets:n};}
function updTotals(){var t=totalsActive(),a=$('#wvol'),b=$('#wsets');if(a)a.textContent=fmtVol(t.vol);if(b)b.textContent=t.sets;}
var chkSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function setRow(e,i,j,ps){
  var s=e.sets[j],p=ps[j],n=0;
  for(var k=0;k<=j;k++)if(e.sets[k].t==='N')n++;
  var lab=s.t==='N'?n:s.t;
  return '<div class="set'+(s.done?' done':'')+'" data-i="'+i+'" data-j="'+j+'">'+
  '<button class="stype t-'+s.t+'" data-act="set-cycle" aria-label="Tipo da série '+lab+'. Toque para alternar entre normal, aquecimento, drop e falha">'+lab+'</button>'+
  '<span class="prev mono">'+(p?dispKg(p.kg)+'×'+p.reps:'—')+'</span>'+
  '<input class="num" data-bind="kg" inputmode="decimal" aria-label="Carga em '+unit()+'" value="'+dispKg(s.kg)+'" placeholder="'+(p?dispKg(p.kg):'')+'">'+
  '<input class="num" data-bind="reps" inputmode="numeric" aria-label="Repetições" value="'+(s.reps==null?'':s.reps)+'" placeholder="'+(p?p.reps:'')+'">'+
  '<button class="chk" data-act="set-done" aria-pressed="'+s.done+'" aria-label="Concluir série">'+chkSvg+'</button>'+
  '<button class="x" data-act="set-del" aria-label="Remover série">×</button></div>';
}
function vActive(){
  var A=S.active,t=totalsActive();
  var h='<header class="wkhead"><div class="wrap"><label class="lbl" for="wname">Treino em andamento</label><input id="wname" class="wname" data-bind="wname" value="'+esc(A.name)+'" aria-label="Nome do treino"><div class="wkstats"><div><span class="lbl">Duração</span><b id="wclock">'+clock(elapsed())+'</b></div><div><span class="lbl">Volume</span><b id="wvol">'+fmtVol(t.vol)+'</b></div><div><span class="lbl">Séries</span><b id="wsets">'+t.sets+'</b></div></div><div class="row"><button class="btn primary" data-act="finish">Finalizar treino</button><button class="btn ghost" data-act="discard-ask">Descartar</button></div></div></header><div class="wrap">';
  if(!A.exs.length)h+='<p class="empty">Treino vazio. Adicione o primeiro exercício.</p>';
  A.exs.forEach(function(e,i){
    var x=exById(e.ex),ps=prevSets(e.ex);
    h+='<section class="excard" data-i="'+i+'"><header><div><h3>'+esc(x.name)+'</h3><span class="tag">'+esc(x.m)+'</span></div><div class="exmenu"><button class="x" data-act="ex-up" aria-label="Mover exercício para cima">↑</button><button class="x" data-act="ex-del" aria-label="Remover exercício">×</button></div></header><input class="exnote" data-bind="note" placeholder="Adicionar nota…" aria-label="Nota do exercício" value="'+esc(e.note||'')+'"><div class="sethead"><span>Série</span><span>Anterior</span><span>'+unit()+'</span><span>Reps</span><span></span><span></span></div>'+e.sets.map(function(_,j){return setRow(e,i,j,ps);}).join('')+'<button class="btn ghost sm block" style="margin-top:8px" data-act="add-set">+ Adicionar série</button></section>';
  });
  return h+'<button class="btn block" data-act="add-ex">+ Adicionar exercício</button></div>';
}
function finish(){
  var A=S.active;
  var exs=A.exs.map(function(e){return {ex:e.ex,note:e.note||'',sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {t:s.t,kg:s.kg||0,reps:s.reps||0,done:true};})};}).filter(function(e){return e.sets.length;});
  if(!exs.length){toast('Marque ao menos uma série como concluída.');return;}
  var prs=[];
  exs.forEach(function(e){
    var h=exHist(e.ex);if(!h.length)return;
    var pk=Math.max.apply(null,h.map(function(x){return x.top;})),pr=Math.max.apply(null,h.map(function(x){return x.rm;}));
    var ss=e.sets.filter(function(s){return s.t!=='W'&&s.reps>0;});if(!ss.length)return;
    var nk=Math.max.apply(null,ss.map(function(s){return s.kg;})),nr=Math.max.apply(null,ss.map(function(s){return rm(s.kg,s.reps);}));
    if(nk>pk+1e-9)prs.push({ex:e.ex,kind:'Maior carga',val:nk});else if(nr>pr+1e-9)prs.push({ex:e.ex,kind:'1RM estimado',val:nr});
  });
  var w={id:A.id,name:(A.name||'').trim()||'Treino',start:A.start,dur:Math.max(60,elapsed()),exs:exs,prs:prs.length};
  S.workouts.push(w);queuePost(w.id);S.active=null;rest=null;save();flushPosts();render();summary(w,prs);
}
function summary(w,prs){
  var st=wkStats(w);

/* ====== Tempo de descanso ====== */
function startRest(){var s=S.settings.rest;if(!s)return;rest={end:Date.now()+s*1000,total:s,done:false};drawRest();}
function drawRest(){
  var el=$('#restbar');
  if(!rest||!S.active){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;el.className='restbar';
  el.innerHTML=rest.done?'<span class="t" style="color:var(--good)">Pronto</span><span class="sp">Descanso concluído. Próxima série.</span><button class="btn sm" data-act="rest-skip">Fechar</button>':'<span class="t" id="rt">'+clock(Math.ceil((rest.end-Date.now())/1000))+'</span><span class="sp">Descanso</span><button class="btn sm ghost" data-act="rest-add" data-v="-15" aria-label="Menos 15 segundos">−15</button><button class="btn sm ghost" data-act="rest-add" data-v="15" aria-label="Mais 15 segundos">+15</button><button class="btn sm" data-act="rest-skip">Pular</button><i class="prog" id="rp" style="width:0"></i>';
}
setInterval(function(){
  if(S.active){var c=$('#wclock');if(c)c.textContent=clock(elapsed());var m=$('#minic');if(m)m.textContent=clock(elapsed());}
  if(rest){
    var left=Math.ceil((rest.end-Date.now())/1000);
    if(!rest.done&&left<=0){rest.done=true;rest.hide=Date.now()+5000;try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}drawRest();}
    else if(rest.done&&Date.now()>rest.hide){rest=null;drawRest();}
    else if(!rest.done){var t=$('#rt');if(t)t.textContent=clock(left);var p=$('#rp');if(p)p.style.width=Math.min(100,100*(1-(rest.end-Date.now())/(rest.total*1000)))+'%';}
  }
},500);

/* ====== Social ====== */
function socBlank(){return {ok:false,prof:null,following:{},requests:[],feed:null,feedAt:0,feedErr:false,people:{},likes:{},liked:{},posts:{},stats:null};}
var soc=socBlank();
var UNAME=/^[a-z0-9_.]{3,20}$/;
function cleanUname(s){return norm(String(s||'')).replace(/[^a-z0-9_.]/g,'').slice(0,20);}
function sugUname(){var b=cleanUname((user&&user.user_metadata&&user.user_metadata.username)||(user&&user.email||'').split('@')[0]);while(b.length<3)b+=Math.floor(Math.random()*10);return b;}
function pname(p){return p?(p.name||p.username||''):'';}
function loadPeople(ids){
  ids=ids.filter(function(id,i,a){return id&&!soc.people[id]&&a.indexOf(id)===i;});
  if(!ids.length)return Promise.resolve();
  return sb.from('profiles').select(pcols()).in('id',ids).then(function(r){if(!r.error)r.data.forEach(function(p){soc.people[p.id]=p;});});
}
function refreshRelations(){
  return Promise.all([
    sb.from('follows').select('following_id,status').eq('follower_id',user.id),
    sb.from('follows').select('follower_id').eq('following_id',user.id).eq('status','pending')
  ]).then(function(rs){
    if(rs[0].error||rs[1].error)throw (rs[0].error||rs[1].error);
    soc.following={};rs[0].data.forEach(function(f){soc.following[f.following_id]=f.status;});
    soc.requests=rs[1].data.map(function(f){return f.follower_id;});
    return loadPeople(soc.requests);
  });
}
function loadSocial(){
  soc.ok=false;
  function q(){return sb.from('profiles').select(pcols()).eq('id',user.id).maybeSingle();}
  function fb(r){if(r.error&&!NOPN&&/player_no/i.test(r.error.message||'')){NOPN=true;return q().then(fb);}if(r.error&&!NOAV&&/avatar/i.test(r.error.message||'')){NOAV=true;return q().then(fb);}return r;}
  return q().then(fb).then(function(r){
    if(r.error)throw r.error;
    soc.prof=r.data;soc.ok=true;
    if(soc.prof){soc.people[user.id]=soc.prof;syncAvatar();return refreshRelations();}
  }).catch(function(){soc.ok=!!soc.prof;});
}
function refreshMyStats(){
  if(!soc.prof)return;
  sb.rpc('profile_stats',{uid:user.id}).then(function(r){if(r.error)return;soc.stats=r.data;var el=$('#mysoc');if(el&&ui.view==='perfil')el.innerHTML=mySocHTML();});
  refreshRelations().then(function(){var el=$('#mysoc');if(el&&ui.view==='perfil')el.innerHTML=mySocHTML();}).catch(function(){});
}

/* Publicação dos treinos concluídos (fila, para funcionar offline) */
function postRow(w){
  var st=wkStats(w);
  return {user_id:user.id,workout_id:w.id,name:String(w.name||'Treino').slice(0,120),started_at:new Date(w.start).toISOString(),duration_s:Math.round(w.dur||0),volume_kg:Math.round(st.vol*10)/10,sets:st.sets,prs:w.prs||0,
    exercises:w.exs.map(function(e){var x=exById(e.ex);return {ex:e.ex,name:x.name,m:x.m,e:x.e,sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {t:s.t,kg:s.kg||0,reps:s.reps||0};})};})};
}
function queuePost(id){S.pendingDel=(S.pendingDel||[]).filter(function(x){return x!==id;});S.pendingPosts=S.pendingPosts||[];if(S.pendingPosts.indexOf(id)<0)S.pendingPosts.push(id);}
function queueDel(id){S.pendingPosts=(S.pendingPosts||[]).filter(function(x){return x!==id;});S.pendingDel=S.pendingDel||[];if(S.pendingDel.indexOf(id)<0)S.pendingDel.push(id);}
var flushing=false;
function flushPosts(){
  if(!user||!soc.prof||flushing||navigator.onLine===false)return Promise.resolve();
  var del=(S.pendingDel||[]).slice(),wipe=!!S.pendingWipe,ids=(S.pendingPosts||[]).slice();
  if(!del.length&&!ids.length&&!wipe)return Promise.resolve();
  flushing=true;var uid=user.id,p=Promise.resolve();
  var chk=function(r){if(r.error)throw r.error;};
  if(wipe)p=p.then(function(){return sb.from('posts').delete().eq('user_id',uid).then(chk);}).then(function(){S.pendingWipe=false;});
  if(del.length)p=p.then(function(){return sb.from('posts').delete().eq('user_id',uid).in('workout_id',del).then(chk);}).then(function(){S.pendingDel=(S.pendingDel||[]).filter(function(x){return del.indexOf(x)<0;});});
  if(ids.length){
    var rows=ids.map(function(id){return S.workouts.filter(function(w){return w.id===id;})[0];}).filter(Boolean).map(postRow);
    for(var i=0;i<rows.length;i+=40)(function(ch){p=p.then(function(){return sb.from('posts').upsert(ch,{onConflict:'user_id,workout_id'}).then(chk);});})(rows.slice(i,i+40));
    p=p.then(function(){S.pendingPosts=(S.pendingPosts||[]).filter(function(x){return ids.indexOf(x)<0;});});
  }
  return p.then(function(){flushing=false;if(user&&user.id===uid){save();soc.feedAt=0;if(ui.view==='inicio')loadFeed(true).then(fillFeed);}},function(){flushing=false;});
}
window.addEventListener('online',function(){if(user)flushPosts();});

/* Feed */
function loadLikes(ids){
  if(!ids.length)return Promise.resolve();
  return sb.from('likes').select('post_id,user_id').in('post_id',ids).then(function(r){
    if(r.error)return;
    ids.forEach(function(id){soc.likes[id]=0;soc.liked[id]=false;});
    r.data.forEach(function(l){soc.likes[l.post_id]=(soc.likes[l.post_id]||0)+1;if(l.user_id===user.id)soc.liked[l.post_id]=true;});
  });
}
function loadFeed(force){
  if(!soc.prof)return Promise.resolve();
  if(!force&&soc.feed&&Date.now()-soc.feedAt<20000)return Promise.resolve();
  var ids=[user.id].concat(Object.keys(soc.following).filter(function(k){return soc.following[k]==='accepted';}));
  return sb.from('posts').select('*').in('user_id',ids).order('started_at',{ascending:false}).limit(40).then(function(r){
    if(r.error)throw r.error;
    soc.feed=r.data;soc.feedAt=Date.now();soc.feedErr=false;
    r.data.forEach(function(p){soc.posts[p.id]=p;});
    return Promise.all([loadPeople(r.data.map(function(p){return p.user_id;})),loadLikes(r.data.map(function(p){return p.id;}))]);
  }).catch(function(){soc.feedErr=true;});
}
function topSet(sets){return (sets||[]).filter(function(s){return s.t!=='W';}).slice().sort(function(a,b){return b.kg-a.kg||b.reps-a.reps;})[0]||null;}
function likeBtn(id){var l=!!soc.liked[id],n=soc.likes[id]||0;return '<button class="btn sm'+(l?' primary':'')+'" data-act="like" data-id="'+id+'" aria-pressed="'+l+'">'+(l?'Curtido':'Curtir')+' · '+n+'</button>';}
function postCard(p){
  var who=soc.people[p.user_id]||{username:'…',name:''},mine=p.user_id===user.id,ex=p.exercises||[];

    '<h3>'+esc(p.name)+'</h3><div class="pstats"><div><span class="lbl">Duração</span><b>'+fmtDur(p.duration_s)+'</b></div><div><span class="lbl">Volume</span><b>'+fmtVol(+p.volume_kg)+'</b></div>'+(p.prs?'<div><span class="lbl">Recordes</span><b>'+p.prs+'</b></div>':'')+'</div>'+
    '<div class="plist">'+ex.slice(0,3).map(function(e){var t=topSet(e.sets);return '<div><span>'+esc(e.name)+'</span><span>'+e.sets.length+'×'+(t?t.reps+' · '+fmtW(t.kg):'')+'</span></div>';}).join('')+(ex.length>3?'<div><span class="note">+ '+(ex.length-3)+' exercícios</span><span></span></div>':'')+'</div>'+
    '<div class="pact">'+likeBtn(p.id)+'<button class="btn sm" data-act="post-open" data-id="'+p.id+'">Ver treino</button>'+(mine?'':'<button class="btn sm ghost" data-act="post-copy" data-id="'+p.id+'">Copiar treino</button>')+'</div></article>';
}
function localFeedHTML(note){
  var ps=posts();
  return (note?'<p class="note">'+note+'</p>':'')+(ps.length?ps.map(function(p){return '<article class="card post"><div class="who">'+avHTML(null,true)+'<div><b>'+esc(p.title)+'</b><small>'+relTime(p.ts)+'</small></div></div><div class="pstats"><div><span class="lbl">Duração</span><b>'+fmtDur(p.dur)+'</b></div><div><span class="lbl">Volume</span><b>'+fmtVol(p.vol)+'</b></div></div><div class="pact"><button class="btn sm" data-act="wk-open" data-id="'+p.wid+'">Ver detalhes</button></div></article>';}).join(''):'<div class="card"><p class="empty">Seus treinos concluídos aparecem aqui.</p></div>');

function feedHTML(){

/* Avatar do Sistema (masculino/feminino) e corpo pelas medidas */
var AV=window.ENGEFIT_AVATAR||null,NOAV=false;
var NOPN=false;
function pcols(){return 'id,username,name,is_private'+(NOAV?'':',avatar')+(NOPN?'':',player_no');}
function pno(p){return p&&p.player_no?'Jogador #'+p.player_no:'';}
var MED=[['cin','Cintura','cm',40,250,'84'],['qua','Quadril','cm',50,250,'98'],['pei','Peito','cm',50,250,'100'],['bra','Braço','cm',15,80,'34'],['cox','Coxa','cm',25,120,'56'],['gor','Gordura','%',3,70,'18']];
function pnum(v){v=String(v==null?'':v).trim().replace(',','.');if(!v)return null;var n=parseFloat(v);return isNaN(n)?NaN:Math.round(n*10)/10;}
function fmtMeas(x){var p=[];if(x.kg>0)p.push(fmtW(x.kg));MED.forEach(function(m){if(x[m[0]]>0)p.push(m[1].toLowerCase()+' '+num(x[m[0]],x[m[0]]%1?1:0)+(m[2]==='%'?'%':' cm'));});return p.join(' · ');}
function myMeasures(){
  var b=S.body.slice().sort(function(a,c){return a.d<c.d?1:-1;});
  function last(k){for(var i=0;i<b.length;i++){if(b[i][k]>0)return b[i][k];}return 0;}
  return {altura:+S.settings.altura||0,peso:last('kg'),cintura:last('cin'),quadril:last('qua'),peito:last('pei'),braco:last('bra'),coxa:last('cox'),gordura:last('gor')};
}
function myAv(){var a=S.settings.avatar;return a&&a.g?a:null;}
function myRank(){return S&&S.workouts?levelInfo().rank:'E';}
function myShape(a){a=a||myAv()||{g:'m'};if(!AV||a.medidas===false)return {fat:0,mus:0,fonte:[]};return AV.shape(a.g,myMeasures());}
function pubAvatar(){var a=myAv(),L=levelInfo(),o={rank:L.rank,lv:L.lv,xp:L.xp};if(!a)return o;o.g=a.g;o.skin=a.skin;o.hair=a.hair;if(a.medidas!==false){var sh=myShape(a);o.fat=sh.fat;o.mus=sh.mus;}return o;}
function avSVG(a,view,label){if(!AV||!a||!a.g)return '';return AV.svg({g:a.g,skin:a.skin,hair:a.hair,rank:a.rank,fat:a.fat,mus:a.mus,view:view,label:label});}
function avHTML(p,me){
  var a=me?pubAvatar():(p&&p.avatar),nm=me?(S.settings.name||'A'):pname(p);
  if(a&&a.g&&AV)return '<span class="av has'+(me?' me':'')+'">'+avSVG(a,'head','Avatar de '+(nm||'pessoa'))+'</span>';
  return '<span class="av'+(me?' me':'')+'">'+esc((nm||'?').charAt(0).toUpperCase())+'</span>';
}
var avT;
function syncAvatar(){
  clearTimeout(avT);avT=setTimeout(function(){
    if(!sb||!user||!soc.prof||NOAV)return;
    var a=pubAvatar()||{};if(JSON.stringify(a)===JSON.stringify(soc.prof.avatar||{}))return;
    sb.from('profiles').update({avatar:a}).eq('id',user.id).then(function(r){if(r.error){if(/avatar/i.test(r.error.message||''))NOAV=true;return;}soc.prof.avatar=a;});

function avEdit(){
  if(!AV)return;
  var cur=myAv(),d={g:cur?cur.g:'m',skin:cur&&cur.skin||'clara',hair:cur&&cur.hair||'',medidas:!cur||cur.medidas!==false};

      return false;}});

/* ---------- Objetivo e missões diárias do Sistema ---------- */
var GOALS=[
  ['emagrecer','Emagrecer','Queimar gordura com treino, passos e cardio.'],
  ['massa','Ganhar massa muscular','Aumentar o tamanho dos músculos com volume de treino.'],
  ['forca','Ganhar força','Subir as cargas nos exercícios principais.'],
  ['condicionamento','Condicionamento físico','Mais fôlego e resistência no dia a dia.'],
  ['saude','Saúde e bem-estar','Movimento constante, sem pressa.']
];
var COMPOUND=['agachamento','supino-reto-barra','levantamento-terra','desenv-barra','remada-curvada','barra-fixa','leg-press','stiff'];
function goalName(k){var g=GOALS.filter(function(x){return x[0]===k;})[0];return g?g[1]:'Saúde e bem-estar';}

function xpNeed(n){return 100+20*(n-1);}
function rankOf(lv){return lv>=55?'S':lv>=35?'A':lv>=20?'B':lv>=10?'C':lv>=5?'D':'E';}
function xpTotal(){
  var x=0,days={};
  S.workouts.forEach(function(w){var s=wkStats(w);x+=Math.min(100,40+2*s.sets);days[dkey(w.start)]=1;});
  Object.keys(S.daily||{}).forEach(function(k){days[k]=1;});
  var t=today();
  Object.keys(days).forEach(function(k){
    if(k>t)return;var e=dayEval(k),r=(S.daily&&S.daily[k])||{};
    if(e.steps)x+=15;if(e.water)x+=15;if(e.req)x+=30;if(e.chal)x+=25;if((r.pc||[]).length>=4)x+=20;
  });
  return x;
}
var lvCache={k:'',v:null};

  var key=S.workouts.length+'|'+JSON.stringify(S.daily||{}).length+'|'+JSON.stringify(S.settings.plan||{}).length+'|'+today();
  if(lvCache.k===key)return lvCache.v;
  var x=xpTotal(),lv=1,rest=x;while(rest>=xpNeed(lv)){rest-=xpNeed(lv);lv++;}
  var v={xp:x,lv:lv,cur:rest,need:xpNeed(lv),rank:rankOf(lv)};lvCache={k:key,v:v};return v;
}

function onbAct(a,el){
  if(!onb)return false;
  if(a==='onb-set'){var k=el.dataset.k,v=el.dataset.v;onb[k]=k==='days'?+v:v;drawOnboard();return true;}
  if(a==='onb-back'){onb.step=Math.max(0,onb.step-1);drawOnboard();return true;}
  if(a==='onb-later'){S.settings.onbLater=today();save();onb=null;hideAuth();render();return true;}
  if(a==='onb-next'){
    if(onb.step===1){S.settings.avatar=Object.assign({},S.settings.avatar||{},{g:onb.g,skin:onb.skin,hair:onbHair()});if(S.settings.avatar.medidas==null)S.settings.avatar.medidas=true;}
    if(onb.step===2){if(!onb.goal)return true;S.settings.goal=onb.goal;}
    if(onb.step===3){
      var alt=pnum($('#onb-alt').value),kg=toKg($('#onb-kg').value);
      if(alt!=null&&(isNaN(alt)||alt<100||alt>250)){toast('Altura: confira o valor.');return true;}
      if($('#onb-kg').value.trim()&&!(kg>=25&&kg<=350)){toast('Peso: confira o valor.');return true;}
      onb.alt=alt||'';onb.kg=$('#onb-kg').value.trim();
      S.settings.days=onb.days;if(alt)S.settings.altura=alt;
      if(kg>0){var d=today(),old=S.body.filter(function(x){return x.d===d;})[0]||{};S.body=S.body.filter(function(x){return x.d!==d;});S.body.push(Object.assign({},old,{d:d,kg:kg}));}
    }
    save();syncAvatar();onb.step++;drawOnboard();return true;
  }
  if(a==='onb-done'||a==='onb-plan'){delete S.settings.onbLater;if(!S.settings.since)S.settings.since=today();save();onb=null;hideAuth();try{history.replaceState(null,'',location.pathname+'#inicio');}catch(e){}route();render();if(a==='onb-plan')planGen();else toast('Bem-vindo ao Sistema.');return true;}
  return false;
}

function bucketWeeks(n){
  var base=weekStart(Date.now()),out=[];
  for(var k=n-1;k>=0;k--){var d=new Date(base);d.setDate(d.getDate()-7*k);out.push({s:d.getTime(),l:pad(d.getDate())+'/'+pad(d.getMonth()+1),n:0,vol:0});}
  S.workouts.forEach(function(w){for(var i=out.length-1;i>=0;i--){if(w.start>=out[i].s){out[i].n++;out[i].vol+=wkStats(w).vol;break;}}});
  return out;
}

/* ====== Dieta: diário alimentar, metas e busca de alimentos ====== */
var DT=window.ENGEFIT_DIET||null;
function nut(){
  var n=S.nutri;if(!n||typeof n!=='object')n=S.nutri={};
  if(!n.days||typeof n.days!=='object')n.days={};
  if(!Array.isArray(n.mine))n.mine=[];
  if(!Array.isArray(n.recent))n.recent=[];
  if(!n.fast||typeof n.fast!=='object')n.fast={start:null,h:16,hist:[]};
  if(!Array.isArray(n.fast.hist))n.fast.hist=[];
  return n;
}
function nGoal(){var g=nut().goal;return g&&g.kcal>0?g:DT.defaultGoal();}
function nRead(d){return nut().days[d]||{items:[],ex:0};}
function nDay(d){var n=nut();return n.days[d]||(n.days[d]={items:[],ex:0});}
function trimNut(){var n=nut(),ks=Object.keys(n.days).sort();while(ks.length>120)delete n.days[ks.shift()];}
function dDay(){return ui.dd||today();}
function dLabel(d){var t=today();return d===t?'Hoje':d===dkOff(t,-1)?'Ontem':fmtDate(new Date(d+'T12:00:00').getTime());}
function defMeal(){var h=new Date().getHours();return h<10?0:h<15?1:h<18?3:2;}
function gFmt(n){return num(n,n%1?1:0);}

function dRing(eaten,budget,left){
  var R=52,C=2*Math.PI*R,p=budget>0?Math.min(1,eaten/budget):0,over=left<0;
  return '<svg class="dring" viewBox="0 0 120 120" role="img" aria-label="'+(over?'Acima da meta em ':'Restam ')+num(Math.abs(left),0)+' calorias"><circle cx="60" cy="60" r="'+R+'" fill="none" stroke="#0d1a30" stroke-width="10"/><circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+(over?'var(--bad)':'var(--accent)')+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 60 60)"/><text x="60" y="60" text-anchor="middle" class="dnum">'+num(Math.abs(left),0)+'</text><text x="60" y="78" text-anchor="middle" class="dlbl">'+(over?'acima':'restantes')+'</text></svg>';
}
function dBar(lbl,v,goal,col){
  var pct=goal>0?Math.min(100,Math.round(v/goal*100)):0;
  return '<div class="mbar"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:nowrap"><span class="lbl">'+lbl+'</span><span class="mono note">'+gFmt(v)+' / '+goal+' g</span></div><div class="xpbar" role="progressbar" aria-label="'+lbl+'" aria-valuemin="0" aria-valuemax="'+goal+'" aria-valuenow="'+Math.round(v)+'"><i style="width:'+pct+'%;background:'+col+';box-shadow:none"></i></div></div>';
}
function vDieta(){
  var h=ph('Diário alimentar','Dieta')+'<div class="wrap">';
  if(!DT)return h+'<div class="card"><p class="empty">Não foi possível carregar a Dieta. Atualize a página.</p></div></div>';
  var d=dDay(),r=nRead(d),g=nGoal(),T=DT.sum(r.items),mg=DT.macroGrams(g.kcal,g.c,g.f,g.p),ex=(r.ex||0)+stepsK(d),left=g.kcal-T.k+ex;
  h+='<div class="row dnav" style="justify-content:space-between;flex-wrap:nowrap;margin-bottom:14px"><button class="btn sm" data-act="d-prev" aria-label="Dia anterior">‹</button><button class="btn ghost sm" data-act="d-today" aria-label="Voltar para hoje"><b>'+esc(dLabel(d))+'</b></button><button class="btn sm" data-act="d-next" aria-label="Próximo dia"'+(d>=today()?' disabled style="opacity:.4"':'')+'>›</button></div>';
  if(!nut().goal)h+='<div class="card row" style="justify-content:space-between;margin-bottom:14px"><div><b>Defina suas metas</b><p class="note">Calorias e macros do dia. Até lá usamos 2000 kcal (50% carboidratos, 30% gorduras, 20% proteínas).</p></div><button class="btn sm primary" data-act="d-goals">Definir metas</button></div>';
  h+='<section class="sys" aria-label="Resumo do dia" style="padding:16px"><div class="row" style="flex-wrap:nowrap;gap:16px;align-items:center">'+dRing(T.k,g.kcal+ex,left)+'<div class="stack" style="gap:8px;flex:1;min-width:0"><div class="dsum"><span>Meta</span><b class="mono">'+num(g.kcal,0)+'</b></div><div class="dsum"><span>Alimentos</span><b class="mono">'+num(T.k,0)+'</b></div><div class="dsum"><span>Exercícios</span><b class="mono">'+num(ex,0)+'</b></div></div></div><p class="note" style="margin:10px 0 12px">Restantes = Meta − Alimentos + Exercícios</p><div class="stack" style="gap:10px">'+dBar('Carboidratos',T.c,mg.c,'var(--accent)')+dBar('Gorduras',T.f,mg.f,'#a78bfa')+dBar('Proteínas',T.p,mg.p,'var(--good)')+'</div>'+dMicro(T,g)+'<div class="row" style="margin-top:14px"><button class="btn sm" data-act="d-goals">Metas</button><button class="btn sm" data-act="d-ex">Exercícios (kcal)</button>'+(!r.items.length&&nRead(dkOff(d,-1)).items.length?'<button class="btn sm" data-act="d-copy">Copiar de ontem</button>':'')+'</div></section>';
  DT.MEALS.forEach(function(name,i){
    var its=r.items.filter(function(x){return x.m===i;}),t=DT.sum(its),goal=Math.round(g.kcal*((g.meals||DT.MEAL_PCT)[i]||0)/100);
    h+='<section class="sec" aria-label="'+esc(name)+'"><div class="sh"><h2 style="font-size:19px">'+esc(name)+'</h2><span class="mono note">'+num(t.k,0)+' / '+num(goal,0)+' kcal</span></div><div class="card" style="padding:4px 16px">'+its.map(function(x){return '<button class="ditem" data-act="d-item" data-id="'+esc(x.id)+'"><span style="min-width:0"><b class="dname">'+esc(x.n)+'</b><small>'+gFmt(x.g)+' g · P '+gFmt(x.p)+' · C '+gFmt(x.c)+' · G '+gFmt(x.f)+'</small></span><b class="mono">'+num(x.k,0)+'</b></button>';}).join('')+'<button class="btn ghost block" style="margin:10px 0" data-act="d-add" data-m="'+i+'">+ Adicionar alimento</button></div></section>';
  });
  h+=dWater(d)+dSteps(d)+dWeight(d)+dFast();
  h+='<p class="note" style="margin-top:22px">Valores aproximados: confira a embalagem quando precisar de precisão. Não substitui orientação de nutricionista. Produtos: dados do Open Food Facts (licença ODbL); alimentos básicos na linha da tabela TACO.</p></div>';
  return h;
}

/* ---- Quantidade (adicionar ou editar um item do diário) ---- */
function foodQty(food,meal,editId,gram,cb){
  var d=dDay(),g=gram>0?gram:(food.g>0?food.g:100),mi=meal;
  function prev(){var v=DT.scale(food.b,g>0?g:0);return '<div class="tiles" style="margin:12px 0"><div class="tile"><span class="lbl">kcal</span><b>'+num(v.k,0)+'</b></div><div class="tile"><span class="lbl">Prot.</span><b>'+gFmt(v.p)+'</b></div><div class="tile"><span class="lbl">Carb.</span><b>'+gFmt(v.c)+'</b></div><div class="tile"><span class="lbl">Gord.</span><b>'+gFmt(v.f)+'</b></div></div>';}
  pushModal({title:editId?'Editar alimento':'Quantidade',
    html:function(){return head(food.name)+'<label class="lbl" for="qg">Quantidade (g)</label><input id="qg" inputmode="decimal" value="'+esc(String(g))+'" aria-label="Quantidade em gramas"><div class="chips" style="margin-top:8px">'+[50,100,150,200,300].map(function(n){return '<button class="chip'+(g===n?' on':'')+'" data-act="q-g" data-v="'+n+'">'+n+' g</button>';}).join('')+'</div><div id="qprev">'+prev()+'</div>'+(cb?'':'<div class="lbl">Refeição</div><div class="scroll-x" style="margin:8px 0 4px"><div class="seg">'+DT.MEALS.map(function(n,i){return '<button class="'+(mi===i?'on':'')+'" data-act="q-m" data-v="'+i+'">'+esc(n)+'</button>';}).join('')+'</div></div>')+'<p class="note">Valores por 100 g: '+per100(food.b)+'</p><div class="row end">'+(editId?'<button class="btn danger" data-act="q-del">Excluir</button>':'<button class="btn ghost" data-act="modal-close">Cancelar</button>')+'<button class="btn primary" data-act="q-ok">'+(editId?'Salvar':'Adicionar')+'</button></div>';},
    input:function(t){if(t.id==='qg'){var v=pnum(t.value);g=v>0?v:0;var p=$('#qprev');if(p)p.innerHTML=prev();document.querySelectorAll('.chips [data-act="q-g"]').forEach(function(b){b.classList.toggle('on',+b.dataset.v===g);});}},
    act:function(a,el){
      if(a==='q-g'){g=+el.dataset.v;drawModal();return true;}
      if(a==='q-m'){mi=+el.dataset.v;drawModal();return true;}
      if(a==='q-del'){var day=nDay(d);day.items=day.items.filter(function(x){return x.id!==editId;});save();stack=[];drawModal();render();toast('Alimento removido.');return true;}
      if(a==='q-ok'){
        if(!(g>0&&g<=5000)){toast('Informe uma quantidade entre 1 e 5000 g.');return true;}
        if(cb){stack.pop();cb(food,g);drawModal();return true;}
        var v=DT.scale(food.b,g),day2=nDay(d);
        if(editId){day2.items.forEach(function(x){if(x.id===editId){x.g=g;x.m=mi;['k','p','c','f','fi','su','na'].forEach(function(key){if(v[key]!=null)x[key]=v[key];else delete x[key];});}});}
        else{
          day2.items.push(Object.assign({id:uid(),m:mi,n:food.name,g:g,b:food.b},v));
          var n=nut();n.recent=[{id:food.id||uid(),name:food.name,src:food.src||'mine',g:g,b:food.b}].concat(n.recent.filter(function(x){return x.name!==food.name;})).slice(0,15);
        }
        trimNut();save();stack=[];drawModal();render();toast(editId?'Alimento atualizado.':'Adicionado ao diário.');return true;
      }
      return false;
    }});
}

    if(tab==='meus'){

      cur=l.concat(rec.filter(function(r){return !l.some(function(m){return m.name===r.name;});}));

    }
    var loc=DT.searchLocal(q,n.mine);

    return '';
  }
  function row(f,i){
    var own=f.src==='mine'||f.src==='recipe',lab=f.src==='off'?'Produto · ':f.src==='mine'?'Meu alimento · ':f.src==='recipe'?'Receita · ':'';
    var main='<button class="ditem" data-act="f-pick" data-i="'+i+'"><span style="min-width:0"><b class="dname">'+esc(f.name)+'</b><small>'+lab+'por 100 g · P '+gFmt(f.b.p)+' · C '+gFmt(f.b.c)+' · G '+gFmt(f.b.f)+'</small></span><b class="mono">'+num(f.b.k,0)+'</b></button>';
    return own?'<div class="ditemw">'+main+'<button class="x" data-act="f-del" data-i="'+i+'" aria-label="Excluir '+esc(f.name)+'">×</button></div>':main;
  }
  function refresh(){
    var el=$('#fl');if(!el)return;
    var empty=list(),h=empty||cur.map(row).join('');
    if(tab==='busca'){
      var qn=q.trim();
      if(qn.length>=2){
        if(offState==='loading')h+='<p class="note" style="padding:10px 0">Buscando produtos na internet…</p>';
        else if(offState==='error'||offState==='timeout')h+='<p class="note" style="padding:10px 0">'+(offState==='timeout'?'A busca de produtos demorou demais.':'Não deu para buscar produtos agora.')+' Os alimentos básicos acima continuam disponíveis.</p>';
        else if(offState==='ok'&&!off.length)h+='<p class="note" style="padding:10px 0">Nenhum produto encontrado'+(cur.length?' além dos acima':'')+'. Tente outro nome, um código de barras ou crie o alimento.</p>';
      }else if(!cur.length)h='<p class="empty">Nenhum alimento encontrado.</p>';
    }

  }
  function schedule(){
    clearTimeout(timer);gen++;if(ctl){ctl.abort();ctl=null;}
    var qn=q.trim();
    if(tab!=='busca'||qn.length<2){off=[];offState='idle';refresh();return;}
    off=[];offState='loading';refresh();
    var my=gen;
    timer=setTimeout(function(){
      ctl=new AbortController();var c=ctl,to=setTimeout(function(){c.abort();},9000);
      DT.searchOFF(qn,c.signal).then(function(res){if(my!==gen)return;off=res;offState='ok';})
        .catch(function(e){if(my!==gen)return;off=[];offState=(e&&e.name==='AbortError')?'timeout':'error';})
        .then(function(){clearTimeout(to);if(my===gen)refresh();});
    },450);
  }
  pushModal({title:'Adicionar alimento',
    html:function(){return head('Adicionar alimento')+'<div class="seg" style="margin-bottom:10px">'+[['busca','Buscar'],['meus','Meus alimentos']].map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" data-act="f-tab" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div><div class="row" style="flex-wrap:nowrap"><input type="search" id="fq" placeholder="Nome do alimento ou código de barras…" aria-label="Buscar alimento" value="'+esc(q)+'" autocomplete="off"><button class="btn sm" data-act="f-scan" aria-label="Ler código de barras com a câmera">Escanear</button></div><div id="fl" style="margin-top:8px;max-height:46vh;overflow:auto"></div><div class="row" style="margin-top:10px;flex-wrap:nowrap"><button class="btn ghost" style="flex:1" data-act="f-new">+ Criar alimento</button>'+(cb?'':'<button class="btn ghost" style="flex:1" data-act="f-rec">+ Criar receita</button>')+'</div>';},
    mount:refresh,
    input:function(t){if(t.id==='fq'&&t.value!==q){q=t.value;schedule();}},
    act:function(a,el){
      if(a==='f-tab'){tab=el.dataset.v;gen++;if(ctl){ctl.abort();ctl=null;}off=[];offState='idle';drawModal();if(tab==='busca'&&q.trim().length>=2)schedule();return true;}
      if(a==='f-pick'){var f=cur[+el.dataset.i];if(f){gen++;if(ctl)ctl.abort();clearTimeout(timer);stack.pop();foodQty(f,meal,null,null,cb);}return true;}
      if(a==='f-new'){gen++;if(ctl)ctl.abort();clearTimeout(timer);stack.pop();foodNew(meal,q.trim(),cb);return true;}
      if(a==='f-scan'){gen++;if(ctl)ctl.abort();clearTimeout(timer);stack.pop();scanBarcode(meal,cb);return true;}
      if(a==='f-rec'){gen++;if(ctl)ctl.abort();clearTimeout(timer);stack.pop();recipeEdit(meal);return true;}
      if(a==='f-del'){var fd=cur[+el.dataset.i];if(!fd)return true;confirmM('Excluir '+(fd.src==='recipe'?'receita':'alimento'),'"'+fd.name+'" será removido da sua lista. O que você já registrou no diário não muda.','Excluir',function(){var nn=nut();nn.mine=nn.mine.filter(function(x){return x.id!==fd.id;});nn.recent=nn.recent.filter(function(x){return !(x.name===fd.name&&(x.src==='mine'||x.src==='recipe'));});save();drawModal();toast('Removido.');},true);return true;}
      return false;
    }});
}

function foodNew(meal,name0,cb){
  var v={n:name0&&!/^\d+$/.test(name0)?name0:'',k:'',p:'',c:'',f:'',fi:'',su:'',na:''};
  pushModal({title:'Criar alimento',
    html:function(){

    input:function(t){var m={fn:'n',fk:'k',fp:'p',fc:'c',ff:'f',ffb:'fi',fsu:'su',fna:'na'}[t.id];if(m)v[m]=t.value;},
    act:function(a){
      if(a!=='n-ok')return false;
      var name=v.n.trim(),k=pnum(v.k),p=pnum(v.p)||0,c=pnum(v.c)||0,f=pnum(v.f)||0;
      if(!name){toast('Dê um nome ao alimento.');return true;}
      if(k==null||isNaN(k)||k<0||k>950){toast('Calorias por 100 g: informe de 0 a 950.');return true;}
      if([p,c,f].some(function(x){return isNaN(x)||x<0||x>100;})){toast('Macros por 100 g: de 0 a 100 g.');return true;}
      var fi=pnum(v.fi),su=pnum(v.su),na=pnum(v.na);
      if((fi!=null&&(isNaN(fi)||fi<0||fi>100))||(su!=null&&(isNaN(su)||su<0||su>100))||(na!=null&&(isNaN(na)||na<0||na>40000))){toast('Confira fibras, açúcares (0 a 100 g) e sódio (0 a 40000 mg).');return true;}
      var food={id:uid(),name:name.slice(0,60),src:'mine',g:100,b:{k:Math.round(k),p:p,c:c,f:f}};
      if(fi!=null)food.b.fi=fi;if(su!=null)food.b.su=su;if(na!=null)food.b.na=Math.round(na);
      nut().mine.push(food);save();stack.pop();foodQty(food,meal,null,null,cb);return true;
    }});
}

/* ---- Fase 3: nutrientes, receitas e câmera ---- */
function per100(b){return num(b.k,0)+' kcal · P '+gFmt(b.p)+' · C '+gFmt(b.c)+' · G '+gFmt(b.f)+(b.fi!=null?' · Fibra '+gFmt(b.fi):'')+(b.na!=null?' · Sódio '+num(b.na,0)+' mg':'');}
function dMicro(T,g){
  var mg=DT.microGoals(g.kcal);
  function bar(lbl,v,goal,unit,lim){
    var pct=goal>0?Math.min(100,Math.round(v/goal*100)):0,over=lim&&v>goal;
    return '<div class="mbar"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:nowrap"><span class="lbl">'+lbl+'</span><span class="mono note"'+(over?' style="color:var(--bad)"':'')+'>'+gFmt(v)+' / '+gFmt(goal)+' '+unit+'</span></div><div class="xpbar" role="progressbar" aria-label="'+lbl+'" aria-valuemin="0" aria-valuemax="'+goal+'" aria-valuenow="'+Math.round(v)+'"><i style="width:'+pct+'%;background:'+(over?'var(--bad)':'#7fd3ff')+';box-shadow:none"></i></div></div>';
  }
  return '<details class="howto" style="margin-top:14px"><summary>Fibras, açúcares e sódio</summary><div class="stack" style="gap:10px;margin-top:10px">'+bar('Fibras (meta)',T.fi,mg.fi,'g',false)+bar('Açúcares (limite)',T.su,mg.su,'g',true)+bar('Sódio (limite)',T.na,mg.na,'mg',true)+'</div><p class="note" style="margin-top:8px">Contam só os alimentos que informam esses valores. Referências gerais da OMS; não substituem orientação de nutricionista.</p></details>';
}

function recipeEdit(meal){
  var R={n:'',s:'1',ings:[]};
  function calc(){return DT.recipe(R.ings,pnum(R.s));}
  function tot(){
    var c=calc();if(!c)return '<p class="note" style="margin-top:10px">Adicione ingredientes e informe quantas porções a receita rende.</p>';
    var v=c.perServ;
    return '<div class="tiles" style="margin:12px 0 6px"><div class="tile"><span class="lbl">kcal</span><b>'+num(v.k,0)+'</b></div><div class="tile"><span class="lbl">Prot.</span><b>'+gFmt(v.p)+'</b></div><div class="tile"><span class="lbl">Carb.</span><b>'+gFmt(v.c)+'</b></div><div class="tile"><span class="lbl">Gord.</span><b>'+gFmt(v.f)+'</b></div></div><p class="note">Por porção ('+c.g+' g). Receita pronta: '+c.totalG+' g, '+num(c.total.k,0)+' kcal.</p>';
  }
  pushModal({title:'Criar receita',
    html:function(){
      return head('Criar receita')+'<label class="lbl" for="rn">Nome da receita</label><input id="rn" maxlength="60" value="'+esc(R.n)+'" aria-label="Nome da receita" autocomplete="off"><label class="lbl" for="rs" style="display:block;margin-top:10px">Porções que a receita rende</label><input id="rs" inputmode="numeric" value="'+esc(R.s)+'" aria-label="Porções que a receita rende"><div class="lbl" style="margin:14px 0 4px">Ingredientes (peso cru ou como for usado)</div>'+
      (R.ings.length?R.ings.map(function(x,i){return '<div class="ditemw"><div class="ditem" style="cursor:default"><span style="min-width:0"><b class="dname">'+esc(x.n)+'</b><small>'+gFmt(x.g)+' g</small></span><b class="mono">'+num(DT.scale(x.b,x.g).k,0)+'</b></div><button class="x" data-act="r-rm" data-i="'+i+'" aria-label="Remover '+esc(x.n)+'">×</button></div>';}).join(''):'<p class="note">Nenhum ingrediente ainda.</p>')+
      '<button class="btn ghost block" style="margin-top:8px" data-act="r-add">+ Adicionar ingrediente</button><div id="rtot">'+tot()+'</div><div class="row end"><button class="btn ghost" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="r-ok">Salvar e adicionar</button></div>';},
    input:function(t){if(t.id==='rn')R.n=t.value;else if(t.id==='rs'){R.s=t.value;var e=$('#rtot');if(e)e.innerHTML=tot();}},
    act:function(a,el){
      if(a==='r-add'){foodPicker(meal,function(food,g){R.ings.push({n:food.name,g:g,b:food.b});});return true;}
      if(a==='r-rm'){R.ings.splice(+el.dataset.i,1);drawModal();return true;}
      if(a==='r-ok'){
        var name=R.n.trim(),c=calc();
        if(!name){toast('Dê um nome à receita.');return true;}
        if(!R.ings.length){toast('Adicione pelo menos um ingrediente.');return true;}
        if(!c){toast('Porções: informe um número de 1 a 100.');return true;}
        var food={id:uid(),name:name.slice(0,60),src:'recipe',g:c.g,b:c.b,serv:pnum(R.s),ing:R.ings.map(function(x){return {n:x.n,g:x.g,b:x.b};})};
        nut().mine.push(food);save();stack.pop();foodQty(food,meal);return true;
      }
      return false;
    }});
}

function scanBarcode(meal,cb){
  var stream=null,timer=null,watch=null,busy=false,done=false,
      ok=!!(window.BarcodeDetector&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  function stop(){clearTimeout(timer);timer=null;if(stream){stream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});stream=null;}}
  function msg(t){var e=$('#scanmsg');if(e)e.textContent=t;}
  function found(code){
    done=true;stop();msg('Procurando o produto…');
    DT.searchOFF(code).then(function(r){
      if(!$('#scanmsg'))return;
      var f=r[0];
      if(f){stack.pop();foodQty(f,meal,null,null,cb);return;}
      msg('Produto '+code+' não encontrado no Open Food Facts. Tente outro ou crie o alimento.');
      timer=setTimeout(function(){done=false;if($('#scanv'))start();},2500);
    }).catch(function(){
      msg('Sem conexão para buscar o produto. Tentando de novo…');
      timer=setTimeout(function(){if($('#scanmsg'))found(code);},3000);
    });
  }
  function loop(det,v){
    if(!$('#scanv')||done){stop();return;}
    var next=function(ms){timer=setTimeout(function(){loop(det,v);},ms);};
    if(busy||v.readyState<2){next(250);return;}
    busy=true;
    det.detect(v).then(function(res){busy=false;var c=res&&res[0]&&res[0].rawValue;if(c&&/^\d{8,14}$/.test(c))found(c);else next(250);}).catch(function(){busy=false;next(400);});
  }
  function start(){
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){
      var v=$('#scanv');
      if(!v||done){s.getTracks().forEach(function(t){try{t.stop();}catch(e){}});return;}
      stream=s;v.srcObject=s;v.muted=true;v.setAttribute('playsinline','');
      var p=v.play&&v.play();if(p&&p.catch)p.catch(function(){});
      var det;try{det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});}catch(e){det=new window.BarcodeDetector();}
      msg('Aponte a câmera para o código de barras.');loop(det,v);
    }).catch(function(e){msg(e&&e.name==='NotAllowedError'?'Permissão da câmera negada. Libere a câmera no navegador ou digite o número do código.':'Não foi possível abrir a câmera. Digite o número do código na busca.');});
  }
  pushModal({title:'Ler código de barras',
    html:function(){return head('Ler código de barras')+(ok?'<video id="scanv" autoplay playsinline muted></video><p class="note" id="scanmsg" style="margin-top:8px" aria-live="polite">Abrindo a câmera…</p>':'<p class="note" id="scanmsg">Este navegador não lê código de barras pela câmera. Digite o número do código na busca de alimentos.</p>')+'<div class="row end"><button class="btn ghost" data-act="s-back">Digitar o código</button></div>';},
    mount:function(){stop();done=false;clearInterval(watch);watch=setInterval(function(){if(!$('#scanv')&&!$('#scanmsg')){clearInterval(watch);watch=null;done=true;stop();}},300);if(ok)start();},
    act:function(a){if(a==='s-back'){done=true;stop();clearInterval(watch);watch=null;stack.pop();foodPicker(meal,cb);return true;}return false;}});
}

    var r=t.closest('.set');if(!r||!S.active)return;
    var s=S.active.exs[+r.dataset.i].sets[+r.dataset.j];
    s[b]=b==='kg'?toKg(t.value):(parseInt(t.value,10)>0?parseInt(t.value,10):null);
    save();updTotals();
  }else if(b==='wname'){S.active.name=t.value;save();}
  else if(b==='note'){S.active.exs[+t.closest('[data-i]').dataset.i].note=t.value;save();}
  else if(b==='exq'){ui.exq=t.value;refreshEx();}
  else if(b==='exe'){ui.exe=t.value;refreshEx();}
  else if(b==='name'){S.settings.name=t.value.trim()||'Atleta';save();if(soc.prof){clearTimeout(pnTimer);pnTimer=setTimeout(function(){profUpdate({name:S.settings.name.slice(0,60)}).catch(function(){});},900);}}

}
