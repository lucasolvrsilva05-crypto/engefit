<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENGEFIT</title>
<meta name="description" content="Registre treinos, acompanhe cargas e evolua com dados.">
<meta name="theme-color" content="#050912">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENGEFIT">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral com navegação + coluna única de trabalho; abas fixas no rodapé em telas estreitas. Estética de prancha técnica. */
:root{
  --bg:#050912; --surface:#0b1424; --surface2:#122038; --ink:#e8f3ff; --muted:#8ea3c2; --line:#1e3352; --grid:rgba(63,184,255,.06);
  --accent:#3fb8ff; --accent-ink:#041322; --blue:#7fd3ff; --good:#4ade80; --bad:#ff5c7a;
  --display:'Chakra Petch','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --tabh:60px; --side:224px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:22px}
h3{font-size:19px}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Estrutura */
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;z-index:5}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none}
.logo svg{width:44px;height:28px;color:var(--accent)}
.logo b{font-family:var(--display);font-size:28px;letter-spacing:.04em}
.logo b i{font-style:normal;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a svg{width:22px;height:22px;flex:none}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--surface)}
.side .foot{margin-top:auto;font:500 11px/1.4 var(--mono);color:var(--muted);padding:0 8px}
.main{margin-left:var(--side);flex:1;min-width:0;padding:0 24px 140px}
.wrap{max-width:860px;margin:0 auto}
.tabs{display:none}

/* Cabeçalho de página */
.ph{margin:0 -24px 22px;padding:30px 24px 22px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border-bottom:1px solid var(--line)}
.ph .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* Componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.sec{margin-top:28px}
.sec>.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tag{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.lbl{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile b{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px;margin-bottom:12px}
input[type=text],input[type=search],input[type=date],input[type=password],input[type=email],input:not([type]),input[inputmode],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.note{font-size:13px;color:var(--muted)}

/* Feed */
.post{display:flex;flex-direction:column;gap:12px}
.post .who{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 16px var(--display);flex:none;border:1px solid var(--line)}
.av.me{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.post .who small{display:block;color:var(--muted);font-size:12px}
.pstats{display:flex;gap:22px;flex-wrap:wrap}
.pstats div{display:flex;flex-direction:column;gap:2px}
.pstats b{font:600 17px var(--mono)}
.plist{display:flex;flex-direction:column;gap:4px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.plist div{display:flex;justify-content:space-between;gap:12px}
.plist span:last-child{color:var(--muted);font-family:var(--mono);font-size:13px;white-space:nowrap}
.pact{display:flex;gap:8px;flex-wrap:wrap}

/* Treino ativo */
.wkhead{position:sticky;top:0;z-index:4;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.wname{font:700 26px var(--display);border:0;background:transparent;padding:4px 0;min-height:0;width:100%;border-radius:0;border-bottom:1px dashed var(--line)}
.wkstats{display:flex;gap:26px;margin:10px 0 12px;flex-wrap:wrap}
.wkstats div{display:flex;flex-direction:column;gap:3px}
.wkstats b{font:600 20px var(--mono)}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.excard header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.excard header h3{color:var(--blue)}
.exnote{border:0;background:transparent;padding:4px 0;min-height:0;font-size:14px;margin-bottom:6px;border-radius:0;border-bottom:1px dashed var(--line);width:100%}
.sethead,.set{display:grid;grid-template-columns:38px minmax(54px,1fr) minmax(0,1.1fr) minmax(0,1.1fr) 42px 28px;gap:8px;align-items:center}
.sethead{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 0 6px;text-align:center}
.set{padding:5px 0;border-radius:8px}
.set.done{background:color-mix(in srgb,var(--good) 14%,transparent)}
.set .prev{color:var(--muted);font-size:13px;text-align:center;white-space:nowrap}
.set input.num{text-align:center;font:600 16px var(--mono);padding:7px 4px;min-height:40px}
.stype{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font:600 14px var(--mono)}
.stype.t-W{color:#a96a00;border-color:#a96a00}
.stype.t-D{color:var(--blue);border-color:var(--blue)}
.stype.t-F{color:var(--bad);border-color:var(--bad)}
.chk{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:20px;height:20px}
.set.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.x{width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;border-radius:6px}
.x:hover{color:var(--bad);background:var(--surface2)}
.exmenu{display:flex;gap:2px}

/* Treinos */
.rt h3{margin-bottom:2px}
.rt p{color:var(--muted);font-size:14px}
.rt .meta{font:500 12px var(--mono);color:var(--muted);margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.folder{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.folder::after{content:"";flex:1;height:1px;background:var(--line)}

/* Exercícios */
.exlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.exitem{display:grid;grid-template-columns:56px 1fr auto;gap:2px 12px;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;align-items:center}
.exitem:last-child{border-bottom:0}
.exitem:hover{background:var(--surface2)}
.exitem .exname{font-weight:600}
.exitem .exmeta{color:var(--muted);font-size:13px;grid-column:2}
.exitem .exsess{grid-column:3;grid-row:1/3;color:var(--muted);font-size:12px;text-align:right}
.exitem.sel{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.filters{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:12px}

/* Gráficos */
svg.ch{width:100%;height:auto;display:block}
.ch .g{stroke:var(--line);stroke-width:1}
.ch .ln{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch .ar{fill:var(--accent);opacity:.13}
.ch .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch .tx{fill:var(--muted);font:11px var(--mono)}
.ch .tv{fill:var(--ink);font:600 12px var(--mono)}
.ch .bar{fill:var(--blue)}
.mrow{display:grid;grid-template-columns:100px 1fr 38px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.mrow .tr{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.mrow .tr i{display:block;height:100%;background:var(--blue);border-radius:5px}
.mrow b{font:600 13px var(--mono);text-align:right}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dw{font:500 11px var(--mono);color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:4px}
.cal button{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:500 14px var(--mono);position:relative;padding:0}
.cal button.has{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal button.sel{outline:2px solid var(--blue);outline-offset:1px}
.cal .blank{visibility:hidden}

/* Doca inferior, modal, toast */
#dock{position:fixed;left:var(--side);right:0;bottom:0;z-index:6;display:flex;flex-direction:column;gap:8px;padding:0 16px 12px;pointer-events:none}
#dock>*{pointer-events:auto;max-width:860px;width:100%;margin:0 auto}
.mini{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:600}
.mini .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
.mini b{margin-left:auto;font-family:var(--mono)}
.mini .go{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:4px 10px;font-size:13px}
@keyframes pulse{50%{opacity:.35}}
.restbar{background:var(--surface);border:1px solid var(--ink);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);position:relative;overflow:hidden}
.restbar[hidden]{display:none}
.restbar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.restbar .t{font:600 22px var(--mono);min-width:64px}
.restbar .sp{flex:1;font-size:13px;color:var(--muted)}
#modal{position:fixed;inset:0;z-index:20;display:none}
#modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,14,20,.55)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.rrow{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;margin-bottom:10px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.rin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rin label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.rin input{text-align:center;font-family:var(--mono);font-weight:600}
.pklist{max-height:46vh;overflow:auto;margin:12px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.lock{overflow:hidden}
.pr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.table th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.table td.n{font-family:var(--mono);text-align:right}
textarea.big{min-height:160px;font:12px/1.4 var(--mono)}

/* Tela de acesso */
body.authmode .app,body.authmode .tabs,body.authmode #dock{display:none}
#auth{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
#auth[hidden]{display:none}
.authbox{width:min(400px,100%);display:flex;flex-direction:column;gap:18px}
.authbox .logo{justify-content:center;padding:0}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.authcard h1{font-size:28px;margin-bottom:4px}
.authcard .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.pw{position:relative;display:block}
.pw input{padding-right:78px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:6px 8px}
.amsg{font-size:14px;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.amsg.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.amsg.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.alinks{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.authfoot{text-align:center;font:500 11px/1.5 var(--mono);color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font:500 11px/1.3 var(--mono);color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.sync[data-s="saving"] i,.sync[data-s="pending"] i{background:var(--blue)}
.sync[data-s="offline"] i,.sync[data-s="error"] i{background:var(--bad)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* Demonstrações ilustradas */
svg.thumb,.thumb-ph{width:56px;height:47px;background:var(--surface2);border-radius:8px;grid-row:1/3;grid-column:1}
.thumb-ph{display:grid;place-items:center;font:600 16px var(--display);color:var(--muted)}
.exitem .exname{grid-column:2}
svg.demo{width:100%;height:auto;display:block;max-height:280px}
.demo-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px;margin-bottom:10px}
.demo-ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 4px 2px}
.demo-frames{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.demo-frames figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.demo-frames figcaption{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:2px 0 4px}
.fig{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig.far{opacity:.3}
.fig-head{fill:var(--ink)}
.gnd{stroke:var(--line);stroke-dasharray:3 3}
.eq-b{fill:var(--surface2);stroke:var(--muted);stroke-width:1.2}
.eq-l{stroke:var(--muted);stroke-linecap:round}
.eq-pad{stroke:var(--line);stroke-linecap:round}
.eq-mat{fill:var(--surface2)}
.eq-c{stroke:var(--blue);stroke-width:1.4}
.eq-pul{fill:var(--surface);stroke:var(--blue);stroke-width:1.4}
.eq-plate,.eq-db{fill:var(--accent);stroke:var(--ink);stroke-width:1}
.eq-hub{fill:var(--surface)}
.eq-roll{fill:var(--surface2);stroke:var(--muted);stroke-width:1.2}
.libfilters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.libfilters .row select{width:auto;min-height:36px;padding:6px 10px}
#install{padding:12px 16px 0}
#install:empty{display:none}
body:not(.authmode) #install{margin-left:var(--side)}
.instbar{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px}
.instbar img{border-radius:10px;flex:none}
.instbar div{flex:1;min-width:0}
.instbar small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.isteps{margin:0 0 14px;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.5}
.pw.at b{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.pw.at input{padding-left:28px;padding-right:11px}
.chkrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;font-size:14px;cursor:pointer}
.chkrow input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.chkrow small{color:var(--muted)}
.avbtn{border:0;background:none;padding:0;border-radius:50%;flex:none}
.namebtn{border:0;background:none;padding:0;font-weight:600;text-align:left;color:var(--ink)}

function migrateLegacy(){

function authErr(e){
  var s=String((e&&(e.message||e.error_description))||e||'').toLowerCase();

function exHist(id){
  var out=[];
  S.workouts.slice().sort(function(a,b){return a.start-b.start;}).forEach(function(w){
    w.exs.forEach(function(e){
      if(e.ex!==id)return;
      var ss=e.sets.filter(function(s){return s.done&&s.t!=='W'&&s.reps>0;});
      if(!ss.length)return;
      out.push({w:w,sets:e.sets.filter(function(s){return s.done;}),top:Math.max.apply(null,ss.map(function(s){return s.kg||0;})),rm:Math.max.apply(null,ss.map(function(s){return rm(s.kg||0,s.reps);})),vol:ss.reduce(function(a,s){return a+(s.kg||0)*s.reps;},0)});
    });
  });
  return out;
}
function prevSets(id){var h=exHist(id);return h.length?h[h.length-1].sets:[];}
function setVol(s){return (s.t==='W'||!s.done)?0:(s.kg||0)*(s.reps||0);}
function wkStats(w){var v=0,n=0;w.exs.forEach(function(e){e.sets.forEach(function(s){if(s.done){n++;v+=setVol(s);}});});return {vol:v,sets:n};}
function sessionCounts(){var c={};S.workouts.forEach(function(w){w.exs.forEach(function(e){c[e.ex]=(c[e.ex]||0)+1;});});return c;}
function weekStart(ts){var d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d;}
function sortedW(){return S.workouts.slice().sort(function(a,b){return b.start-a.start;});}

/* ====== Gráficos ====== */
function lineChart(pts,fmt){
  if(!pts.length)return '<p class="empty">Sem dados para este gráfico.</p>';
  var W=600,H=220,pl=48,pr=18,pt=22,pb=28;
  var mn=Math.min.apply(null,pts.map(function(p){return p.v;})),mx=Math.max.apply(null,pts.map(function(p){return p.v;}));
  if(mn===mx){mn-=1;mx+=1;}
  var p10=(mx-mn)*0.12;mn-=p10;mx+=p10;
  var X=function(i){return pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1));};
  var Y=function(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de linha com '+pts.length+' pontos">';
  for(var k=0;k<4;k++){var val=mn+(mx-mn)*k/3,y=Y(val);s+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="tx" x="'+(pl-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+fmt(val)+'</text>';}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' ');
  s+='<path class="ar" d="'+d+' L'+X(pts.length-1).toFixed(1)+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z"/><path class="ln" d="'+d+'"/>';
  var idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter(function(v,i,a){return a.indexOf(v)===i;});
  idx.forEach(function(i){s+='<text class="tx" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0&&pts.length>1?'start':i===pts.length-1&&pts.length>1?'end':'middle')+'">'+esc(pts[i].l)+'</text>';});
  var li=pts.length-1,ly=Y(pts[li].v);
  s+='<circle class="pt" cx="'+X(li).toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5"/><text class="tv" x="'+X(li).toFixed(1)+'" y="'+(ly<pt+8?ly+20:ly-10).toFixed(1)+'" text-anchor="end">'+fmt(pts[li].v)+'</text></svg>';
  return s;
}
function barChart(items){
  var W=600,H=190,pl=12,pr=12,pt=22,pb=28,n=items.length;
  var mx=Math.max.apply(null,items.map(function(i){return i.v;}).concat([1]));
  var slot=(W-pl-pr)/n,bw=Math.min(40,slot*0.6);
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de barras semanal"><line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  items.forEach(function(it,i){
    var h=(H-pt-pb)*it.v/mx,x=pl+slot*i+(slot-bw)/2,y=H-pb-h;
    if(it.v>0)s+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/><text class="tv" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+it.v+'</text>';
    if(n<=8||i%2===(n-1)%2)s+='<text class="tx" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(it.l)+'</text>';
  });
  return s+'</svg>';
}

var demoA={raf:0,id:null,paused:false,t0:0,last:0,at:0};
function stopDemo(){if(demoA.raf)cancelAnimationFrame(demoA.raf);demoA.raf=0;}
function demoU(ms){var p=(ms%3600)/3600,e=function(v){return 0.5-0.5*Math.cos(Math.PI*v);};return p<.12?0:p<.45?e((p-.12)/.33):p<.62?1:p<.95?1-e((p-.62)/.33):0;}
function demoLoop(now){
  demoA.raf=requestAnimationFrame(demoLoop);
  var el=document.getElementById('demo-anim');if(!el){stopDemo();return;}
  if(demoA.paused||now-demoA.last<33)return;demoA.last=now;
  el.innerHTML=DM.svg(demoA.id,demoU(now-demoA.t0),'demo');
}
function startDemo(id){
  stopDemo();if(!DM.has(id))return;demoA.id=id;demoA.t0=performance.now();
  var rm=false;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  demoA.paused=rm;updDemoBtn();demoA.raf=requestAnimationFrame(demoLoop);
}
function updDemoBtn(){var b=$('#demo-btn');if(b){b.textContent=demoA.paused?'Animar':'Pausar';b.setAttribute('aria-pressed',String(!demoA.paused));}}

function finish(){
  var A=S.active;
  var exs=A.exs.map(function(e){return {ex:e.ex,note:e.note||'',sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {t:s.t,kg:s.kg||0,reps:s.reps||0,done:true};})};}).filter(function(e){return e.sets.length;});
  if(!exs.length){toast('Marque ao menos uma série como concluída.');return;}
  var prs=[];
  exs.forEach(function(e){
    var h=exHist(e.ex);if(!h.length)return;
    var pk=Math.max.apply(null,h.map(function(x){return x.top;})),pr=Math.max.apply(null,h.map(function(x){return x.rm;}));
    var ss=e.sets.filter(function(s){return s.t!=='W'&&s.reps>0;});if(!ss.length)return;
    var nk=Math.max.apply(null,ss.map(function(s){return s.kg;})),nr=Math.max.apply(null,ss.map(function(s){return rm(s.kg,s.reps);}));
    if(nk>pk+1e-9)prs.push({ex:e.ex,kind:'Maior carga',val:nk});else if(nr>pr+1e-9)prs.push({ex:e.ex,kind:'1RM estimado',val:nr});
  });
  var w={id:A.id,name:(A.name||'').trim()||'Treino',start:A.start,dur:Math.max(60,elapsed()),exs:exs,prs:prs.length};
  S.workouts.push(w);queuePost(w.id);S.active=null;rest=null;save();flushPosts();render();summary(w,prs);
}

    else if(rest.done&&Date.now()>rest.hide){rest=null;drawRest();}
    else if(!rest.done){var t=$('#rt');if(t)t.textContent=clock(left);var p=$('#rp');if(p)p.style.width=Math.min(100,100*(1-(rest.end-Date.now())/(rest.total*1000)))+'%';}
  }

/* ====== Social ====== */
function socBlank(){return {ok:false,prof:null,following:{},requests:[],feed:null,feedAt:0,feedErr:false,people:{},likes:{},liked:{},posts:{},stats:null};}
var soc=socBlank();
var UNAME=/^[a-z0-9_.]{3,20}$/;
function cleanUname(s){return norm(String(s||'')).replace(/[^a-z0-9_.]/g,'').slice(0,20);}
function sugUname(){var b=cleanUname((user&&user.user_metadata&&user.user_metadata.username)||(user&&user.email||'').split('@')[0]);while(b.length<3)b+=Math.floor(Math.random()*10);return b;}
function pname(p){return p?(p.name||p.username||''):'';}
function loadPeople(ids){
  ids=ids.filter(function(id,i,a){return id&&!soc.people[id]&&a.indexOf(id)===i;});
  if(!ids.length)return Promise.resolve();
  return sb.from('profiles').select(pcols()).in('id',ids).then(function(r){if(!r.error)r.data.forEach(function(p){soc.people[p.id]=p;});});
}
function refreshRelations(){
  return Promise.all([
    sb.from('follows').select('following_id,status').eq('follower_id',user.id),
    sb.from('follows').select('follower_id').eq('following_id',user.id).eq('status','pending')
  ]).then(function(rs){
    if(rs[0].error||rs[1].error)throw (rs[0].error||rs[1].error);
    soc.following={};rs[0].data.forEach(function(f){soc.following[f.following_id]=f.status;});
    soc.requests=rs[1].data.map(function(f){return f.follower_id;});
    return loadPeople(soc.requests);
  });
}
function loadSocial(){
  soc.ok=false;
  function q(){return sb.from('profiles').select(pcols()).eq('id',user.id).maybeSingle();}
  return q().then(function(r){if(r.error&&!NOAV&&/avatar/i.test(r.error.message||'')){NOAV=true;return q();}return r;}).then(function(r){
    if(r.error)throw r.error;
    soc.prof=r.data;soc.ok=true;
    if(soc.prof){soc.people[user.id]=soc.prof;syncAvatar();return refreshRelations();}
  }).catch(function(){soc.ok=!!soc.prof;});
}
function refreshMyStats(){

  sb.rpc('profile_stats',{uid:user.id}).then(function(r){if(r.error)return;soc.stats=r.data;var el=$('#mysoc');if(el&&ui.view==='perfil')el.innerHTML=mySocHTML();});
  refreshRelations().then(function(){var el=$('#mysoc');if(el&&ui.view==='perfil')el.innerHTML=mySocHTML();}).catch(function(){});

/* Publicação dos treinos concluídos (fila, para funcionar offline) */
function postRow(w){
  var st=wkStats(w);
  return {user_id:user.id,workout_id:w.id,name:String(w.name||'Treino').slice(0,120),started_at:new Date(w.start).toISOString(),duration_s:Math.round(w.dur||0),volume_kg:Math.round(st.vol*10)/10,sets:st.sets,prs:w.prs||0,
    exercises:w.exs.map(function(e){var x=exById(e.ex);return {ex:e.ex,name:x.name,m:x.m,e:x.e,sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {t:s.t,kg:s.kg||0,reps:s.reps||0};})};})};
}
function queuePost(id){S.pendingDel=(S.pendingDel||[]).filter(function(x){return x!==id;});S.pendingPosts=S.pendingPosts||[];if(S.pendingPosts.indexOf(id)<0)S.pendingPosts.push(id);}
function queueDel(id){S.pendingPosts=(S.pendingPosts||[]).filter(function(x){return x!==id;});S.pendingDel=S.pendingDel||[];if(S.pendingDel.indexOf(id)<0)S.pendingDel.push(id);}
var flushing=false;
function flushPosts(){
  if(!user||!soc.prof||flushing||navigator.onLine===false)return Promise.resolve();
  var del=(S.pendingDel||[]).slice(),wipe=!!S.pendingWipe,ids=(S.pendingPosts||[]).slice();
  if(!del.length&&!ids.length&&!wipe)return Promise.resolve();
  flushing=true;var uid=user.id,p=Promise.resolve();
  var chk=function(r){if(r.error)throw r.error;};
  if(wipe)p=p.then(function(){return sb.from('posts').delete().eq('user_id',uid).then(chk);}).then(function(){S.pendingWipe=false;});
  if(del.length)p=p.then(function(){return sb.from('posts').delete().eq('user_id',uid).in('workout_id',del).then(chk);}).then(function(){S.pendingDel=(S.pendingDel||[]).filter(function(x){return del.indexOf(x)<0;});});
  if(ids.length){
    var rows=ids.map(function(id){return S.workouts.filter(function(w){return w.id===id;})[0];}).filter(Boolean).map(postRow);
    for(var i=0;i<rows.length;i+=40)(function(ch){p=p.then(function(){return sb.from('posts').upsert(ch,{onConflict:'user_id,workout_id'}).then(chk);});})(rows.slice(i,i+40));
    p=p.then(function(){S.pendingPosts=(S.pendingPosts||[]).filter(function(x){return ids.indexOf(x)<0;});});
  }
  return p.then(function(){flushing=false;if(user&&user.id===uid){save();soc.feedAt=0;if(ui.view==='inicio')loadFeed(true).then(fillFeed);}},function(){flushing=false;});
}
window.addEventListener('online',function(){if(user)flushPosts();});

/* Feed */
function loadLikes(ids){
  if(!ids.length)return Promise.resolve();
  return sb.from('likes').select('post_id,user_id').in('post_id',ids).then(function(r){
    if(r.error)return;
    ids.forEach(function(id){soc.likes[id]=0;soc.liked[id]=false;});
    r.data.forEach(function(l){soc.likes[l.post_id]=(soc.likes[l.post_id]||0)+1;if(l.user_id===user.id)soc.liked[l.post_id]=true;});
  });
}
function loadFeed(force){
  if(!soc.prof)return Promise.resolve();
  if(!force&&soc.feed&&Date.now()-soc.feedAt<20000)return Promise.resolve();
  var ids=[user.id].concat(Object.keys(soc.following).filter(function(k){return soc.following[k]==='accepted';}));
  return sb.from('posts').select('*').in('user_id',ids).order('started_at',{ascending:false}).limit(40).then(function(r){
    if(r.error)throw r.error;
    soc.feed=r.data;soc.feedAt=Date.now();soc.feedErr=false;
    r.data.forEach(function(p){soc.posts[p.id]=p;});
    return Promise.all([loadPeople(r.data.map(function(p){return p.user_id;})),loadLikes(r.data.map(function(p){return p.id;}))]);
  }).catch(function(){soc.feedErr=true;});
}
function topSet(sets){return (sets||[]).filter(function(s){return s.t!=='W';}).slice().sort(function(a,b){return b.kg-a.kg||b.reps-a.reps;})[0]||null;}
function likeBtn(id){var l=!!soc.liked[id],n=soc.likes[id]||0;return '<button class="btn sm'+(l?' primary':'')+'" data-act="like" data-id="'+id+'" aria-pressed="'+l+'">'+(l?'Curtido':'Curtir')+' · '+n+'</button>';}
function postCard(p){

function localFeedHTML(note){
  var ps=posts();

function feedHTML(){
  if(!soc.prof)return localFeedHTML(soc.ok?'':'Sem conexão com a comunidade agora. Mostrando só os seus treinos.');

/* Avatar do Sistema (masculino/feminino) e corpo pelas medidas */
var AV=window.ENGEFIT_AVATAR||null,NOAV=false;
function pcols(){return 'id,username,name,is_private'+(NOAV?'':',avatar');}
var MED=[['cin','Cintura','cm',40,250,'84'],['qua','Quadril','cm',50,250,'98'],['pei','Peito','cm',50,250,'100'],['bra','Braço','cm',15,80,'34'],['cox','Coxa','cm',25,120,'56'],['gor','Gordura','%',3,70,'18']];
function pnum(v){v=String(v==null?'':v).trim().replace(',','.');if(!v)return null;var n=parseFloat(v);return isNaN(n)?NaN:Math.round(n*10)/10;}
function fmtMeas(x){var p=[];if(x.kg>0)p.push(fmtW(x.kg));MED.forEach(function(m){if(x[m[0]]>0)p.push(m[1].toLowerCase()+' '+num(x[m[0]],x[m[0]]%1?1:0)+(m[2]==='%'?'%':' cm'));});return p.join(' · ');}
function myMeasures(){
  var b=S.body.slice().sort(function(a,c){return a.d<c.d?1:-1;});
  function last(k){for(var i=0;i<b.length;i++){if(b[i][k]>0)return b[i][k];}return 0;}
  return {altura:+S.settings.altura||0,peso:last('kg'),cintura:last('cin'),quadril:last('qua'),peito:last('pei'),braco:last('bra'),coxa:last('cox'),gordura:last('gor')};
}
function myAv(){var a=S.settings.avatar;return a&&a.g?a:null;}
function myRank(){return 'E';}
function myShape(a){a=a||myAv()||{g:'m'};if(!AV||a.medidas===false)return {fat:0,mus:0,fonte:[]};return AV.shape(a.g,myMeasures());}
function pubAvatar(){var a=myAv();if(!a)return null;var o={g:a.g,skin:a.skin,hair:a.hair,rank:myRank()};if(a.medidas!==false){var sh=myShape(a);o.fat=sh.fat;o.mus=sh.mus;}return o;}
function avSVG(a,view,label){if(!AV||!a||!a.g)return '';return AV.svg({g:a.g,skin:a.skin,hair:a.hair,rank:a.rank,fat:a.fat,mus:a.mus,view:view,label:label});}
function avHTML(p,me){
  var a=me?pubAvatar():(p&&p.avatar),nm=me?(S.settings.name||'A'):pname(p);
  if(a&&a.g&&AV)return '<span class="av has'+(me?' me':'')+'">'+avSVG(a,'head','Avatar de '+(nm||'pessoa'))+'</span>';
  return '<span class="av'+(me?' me':'')+'">'+esc((nm||'?').charAt(0).toUpperCase())+'</span>';
}
var avT;
function syncAvatar(){
  clearTimeout(avT);avT=setTimeout(function(){
    if(!sb||!user||!soc.prof||NOAV)return;
    var a=pubAvatar()||{};if(JSON.stringify(a)===JSON.stringify(soc.prof.avatar||{}))return;
    sb.from('profiles').update({avatar:a}).eq('id',user.id).then(function(r){if(r.error){if(/avatar/i.test(r.error.message||''))NOAV=true;return;}soc.prof.avatar=a;});
  },700);
}
function statusWin(){
  if(!AV)return '';
  var a=myAv();
  if(!a)return '<section class="sys statuswin" aria-label="Janela de status"><div class="avduo">'+avSVG({g:'m',rank:'E'},'full','Avatar masculino')+avSVG({g:'f',rank:'E'},'full','Avatar feminino')+'</div><div><p class="eyebrow">Janela de status</p><h2>'+esc(S.settings.name||'Atleta')+'</h2><p class="note" style="margin:8px 0 14px">Escolha seu personagem: masculino ou feminino, tom de pele e cabelo. O corpo acompanha as medidas que você registrar.</p><button class="btn primary" data-act="av-edit">Criar meu avatar</button></div></section>';
  var sh=myShape(a),rk=myRank(),col=AV.AURA[rk];
  return '<section class="sys statuswin" aria-label="Janela de status"><div class="avfull">'+avSVG(pubAvatar(),'full','Seu avatar')+'</div><div><p class="eyebrow">Janela de status</p><h2>'+esc(S.settings.name||'Atleta')+'</h2>'+
    '<div class="row" style="margin:12px 0 2px;gap:12px;flex-wrap:nowrap"><span class="rank" style="color:'+col+'">'+rk+'</span><div><b>Rank '+rk+'</b><br><small class="note">Todo caçador começa no rank E.</small></div></div>'+
    '<div class="swlist"><div class="swrow"><span class="lbl">Forma</span><b>'+AV.label(sh)+'</b></div><div class="swrow"><span class="lbl">Corpo</span><span>'+(a.medidas===false?'Padrão':sh.fonte.length?'Pelas suas medidas':'Padrão · sem medidas')+'</span></div></div>'+
    '<div class="row"><button class="btn sm primary" data-act="av-edit">Personalizar avatar</button><button class="btn sm" data-act="ptab" data-v="body">Medidas</button></div></div></section>';
}
function avEdit(){
  if(!AV)return;
  var cur=myAv(),d={g:cur?cur.g:'m',skin:cur&&cur.skin||'clara',hair:cur&&cur.hair||'',medidas:!cur||cur.medidas!==false};
  var SKN=[['clara','clara'],['media','média'],['morena','morena'],['escura','escura']];
  function hair(){return d.hair||(d.g==='f'?'Vinho':'Grafite');}
  function prev(){var sh=d.medidas?AV.shape(d.g,myMeasures()):{fat:0,mus:0};return avSVG({g:d.g,skin:d.skin,hair:hair(),rank:myRank(),fat:sh.fat,mus:sh.mus},'full','Prévia do avatar');}
  pushModal({title:'Personalizar avatar',html:function(){
    return head('Personalizar avatar')+'<div class="avpick"><div class="sys prev">'+prev()+'</div><div>'+
      '<div class="lbl">Personagem</div><div class="seg" style="margin:7px 0 14px">'+[['m','Masculino'],['f','Feminino']].map(function(x){return '<button data-act="avd" data-k="g" data-v="'+x[0]+'" class="'+(d.g===x[0]?'on':'')+'" aria-pressed="'+(d.g===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>'+
      '<div class="lbl">Tom de pele</div><div class="swatches">'+SKN.map(function(x){var on=d.skin===x[0];return '<button class="sw'+(on?' on':'')+'" style="background:'+AV.SKIN[x[0]][0]+'" data-act="avd" data-k="skin" data-v="'+x[0]+'" aria-label="Pele '+x[1]+'" aria-pressed="'+on+'"></button>';}).join('')+'</div>'+
      '<div class="lbl">Cabelo</div><div class="swatches">'+Object.keys(AV.HAIR).map(function(k){var on=hair()===k;return '<button class="sw'+(on?' on':'')+'" style="background:'+AV.HAIR[k][0]+'" data-act="avd" data-k="hair" data-v="'+k+'" aria-label="Cabelo '+k+'" aria-pressed="'+on+'" title="'+k+'"></button>';}).join('')+'</div>'+
      '<label class="chkrow" style="margin:0"><input type="checkbox" id="avmed" data-act="avd" data-k="medidas"'+(d.medidas?' checked':'')+'><span><b>Corpo pelas medidas</b><br><small>O corpo do avatar acompanha o que você registra com a fita métrica.</small></span></label>'+
      '</div></div><div class="row end"><button class="btn ghost" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="av-save">Salvar avatar</button></div>';},
    act:function(x,el){
      if(x==='avd'){var k=el.dataset.k;if(k==='medidas')d.medidas=!!el.checked;else d[k]=el.dataset.v;drawModal();return true;}
      if(x==='av-save'){S.settings.avatar={g:d.g,skin:d.skin,hair:hair(),medidas:d.medidas};save();syncAvatar();popModal();render();toast('Avatar salvo.');return true;}
      return false;}});
}

/* Aba Pessoas */
function vPessoas(){
  var h=ph('Comunidade ENGEFIT','Guilda')+'<div class="wrap">';
  if(!soc.prof)return h+'<div class="card"><p class="empty">Sem conexão com a comunidade agora. Tente de novo em instantes.</p></div></div>';
  return h+'<input type="search" id="pq" data-bind="pq" placeholder="Buscar por nome ou @usuário" aria-label="Buscar pessoas" value="'+esc(ui.pq||'')+'"><div id="plist" class="stack" style="margin-top:14px"></div></div>';
}
var pgen=0,ptimer=null;
function loadPeopleList(){
  var el=$('#plist');if(!el||!soc.prof)return;
  var g=++pgen,q=(ui.pq||'').trim().replace(/^@/,''),qq=q.replace(/[^\p{L}\p{N}_. ]/gu,'').slice(0,30);
  if(!el.innerHTML)el.innerHTML='<div class="spin" role="status" aria-label="Carregando"></div>';
  var base=sb.from('profiles').select(pcols()).neq('id',user.id);
  var req=q?(qq?base.or('username.ilike.%'+qq+'%,name.ilike.%'+qq+'%').limit(30):Promise.resolve({data:[]})):base.order('created_at',{ascending:false}).limit(30);
  Promise.all([req,q?Promise.resolve():refreshRelations()]).then(function(rs){
    if(g!==pgen)return;var r=rs[0];if(r.error)throw r.error;
    r.data.forEach(function(p){soc.people[p.id]=p;});
    var h='';
    if(!q&&soc.requests.length){
      h+='<h2 style="margin-top:4px">Pedidos para seguir você</h2>'+soc.requests.map(function(id){var p=soc.people[id];return p?personRow(p,'<button class="btn sm primary" data-act="accept" data-id="'+id+'">Aceitar</button><button class="btn sm ghost" data-act="reject" data-id="'+id+'">Recusar</button>'):'';}).join('');
    }
    h+=q?'':'<h2 style="margin-top:8px">Pessoas no ENGEFIT</h2>';
    h+=r.data.length?r.data.map(function(p){return personRow(p);}).join(''):'<p class="empty">'+(q?'Ninguém encontrado com “'+esc(q)+'”.':'Ainda não há outras pessoas por aqui. Convide alguém para treinar com você.')+'</p>';
    el.innerHTML=h;
  }).catch(function(){if(g===pgen)el.innerHTML='<p class="empty">Não deu para carregar. Verifique sua conexão.</p>';});
}
function follow(id){
  soc.following[id]='…';updFbtn(id);
  sb.from('follows').insert({follower_id:user.id,following_id:id}).select('status').single().then(function(r){
    if(r.error&&r.error.code!=='23505')throw r.error;
    soc.following[id]=r.data?r.data.status:'accepted';soc.feedAt=0;updFbtn(id);
    toast(soc.following[id]==='pending'?'Pedido enviado. Você verá os treinos quando for aceito.':'Agora você segue @'+((soc.people[id]||{}).username||''));
    if(stack.length&&stack[stack.length-1].pid===id)stack[stack.length-1].reload();
  }).catch(function(){delete soc.following[id];updFbtn(id);toast('Não deu para seguir agora. Tente de novo.');});
}
function unfollow(id){
  var was=soc.following[id];
  var go=function(){
    delete soc.following[id];updFbtn(id);soc.feedAt=0;if(soc.feed)soc.feed=soc.feed.filter(function(p){return p.user_id!==id;});
    sb.from('follows').delete().eq('follower_id',user.id).eq('following_id',id).then(function(r){if(r.error)throw r.error;if(stack.length&&stack[stack.length-1].pid===id)stack[stack.length-1].reload();}).catch(function(){soc.following[id]=was;updFbtn(id);toast('Não deu para concluir. Tente de novo.');});
  };
  if(was==='pending'){go();toast('Pedido cancelado.');return;}
  confirmM('Deixar de seguir','Os treinos de @'+((soc.people[id]||{}).username||'')+' saem do seu feed.','Deixar de seguir',go,true);
}

/* Perfil de outra pessoa */
function openProfile(uid){
  var st={p:soc.people[uid]||null,stats:null,posts:null,err:false,loaded:false};
  var m={title:'Perfil',pid:uid,
    html:function(){
      var p=st.p;
      if(st.err)return head('Perfil')+'<p class="empty">Não foi possível abrir este perfil.</p>';
      if(!p)return head('Perfil')+'<div class="spin" role="status" aria-label="Carregando"></div>';
      var me=uid===user.id,vis=me||!p.is_private||soc.following[uid]==='accepted',s=st.stats||{};
      var h=head(pname(p))+'<p class="note" style="margin:-8px 0 14px">@'+esc(p.username)+(p.is_private?' · <span class="tag">Privado</span>':'')+'</p>';
      var pa=me?pubAvatar():p.avatar;if(pa&&pa.g&&AV)h+='<div class="sys profav">'+avSVG(pa,'bust','Avatar de '+pname(p))+'</div>';
      h+='<div class="kv"><div class="tile"><span class="lbl">Treinos</span><b>'+(s.workouts!=null?s.workouts:'–')+'</b></div><div class="tile"><span class="lbl">Seguidores</span><b>'+(s.followers!=null?s.followers:'–')+'</b></div><div class="tile"><span class="lbl">Seguindo</span><b>'+(s.following!=null?s.following:'–')+'</b></div></div>';
      if(!me)h+='<div class="row" style="margin-bottom:16px"><span data-fbtn="'+uid+'">'+fbtn(uid)+'</span></div>';
      if(!vis)return h+'<div class="card"><p class="empty">Este perfil é privado. '+(soc.following[uid]==='pending'?'Seu pedido está aguardando aprovação.':'Siga para pedir acesso aos treinos.')+'</p></div>';
      if(!st.loaded)return h+'<div class="spin" role="status" aria-label="Carregando"></div>';
      if(!st.posts.length)return h+'<div class="card"><p class="empty">Nenhum treino publicado ainda.</p></div>';
      var vol=st.posts.reduce(function(a,x){return a+(+x.volume_kg||0);},0),best={};
      st.posts.forEach(function(x){(x.exercises||[]).forEach(function(e){var t=topSet(e.sets);if(t&&t.kg>0&&(!best[e.name]||t.kg>best[e.name].kg))best[e.name]={kg:t.kg,reps:t.reps};});});
      var rec=Object.keys(best).sort(function(a,b){return best[b].kg-best[a].kg;}).slice(0,6);
      h+='<div class="tile" style="margin-bottom:14px"><span class="lbl">Volume nos últimos '+st.posts.length+' treinos</span><b>'+fmtVol(vol)+'</b></div>';
      if(rec.length)h+='<h3 style="margin-bottom:6px">Recordes</h3><table class="table" style="margin-bottom:18px"><thead><tr><th>Exercício</th><th style="text-align:right">Melhor série</th></tr></thead><tbody>'+rec.map(function(n){return '<tr><td>'+esc(n)+'</td><td class="n">'+fmtW(best[n].kg)+' × '+best[n].reps+'</td></tr>';}).join('')+'</tbody></table>';
      return h+'<h3 style="margin-bottom:10px">Treinos</h3><div class="stack">'+st.posts.map(postCard).join('')+'</div>';
    },
    reload:function(){load();}
  };
  function load(){
    Promise.all([sb.from('profiles').select(pcols()).eq('id',uid).maybeSingle(),sb.rpc('profile_stats',{uid:uid}),sb.from('posts').select('*').eq('user_id',uid).order('started_at',{ascending:false}).limit(30)]).then(function(rs){
      if(rs[0].error||!rs[0].data)throw 0;
      st.p=rs[0].data;soc.people[uid]=st.p;st.stats=rs[1].error?null:rs[1].data;st.posts=rs[2].error?[]:rs[2].data;
      st.posts.forEach(function(x){soc.posts[x.id]=x;});
      return loadLikes(st.posts.map(function(x){return x.id;}));
    }).then(function(){st.loaded=true;if(stack[stack.length-1]===m)drawModal();}).catch(function(){st.err=true;if(stack[stack.length-1]===m)drawModal();});
  }
  pushModal(m);load();
}
function postDetail(id){
  var p=soc.posts[id];if(!p)return;var who=soc.people[p.user_id]||{},mine=p.user_id===user.id;
  pushModal({title:p.name,html:function(){
    return head(p.name)+'<p class="note" style="margin:-8px 0 12px">'+esc(pname(who))+' · @'+esc(who.username||'')+' · '+fmtDate(Date.parse(p.started_at))+'</p><div class="kv"><div class="tile"><span class="lbl">Duração</span><b>'+fmtDur(p.duration_s)+'</b></div><div class="tile"><span class="lbl">Volume</span><b>'+fmtVol(+p.volume_kg)+'</b></div><div class="tile"><span class="lbl">Séries</span><b>'+p.sets+'</b></div></div>'+
      (p.exercises||[]).map(function(e){return '<div style="margin-bottom:12px"><b>'+esc(e.name)+'</b><div class="mono" style="font-size:13px;color:var(--muted)">'+e.sets.map(function(s){return (s.t!=='N'?s.t+' ':'')+dispKg(s.kg)+'×'+s.reps;}).join(' · ')+'</div></div>';}).join('')+
      '<div class="row end">'+likeBtn(id)+'<button class="btn" data-act="open-prof" data-id="'+p.user_id+'">Ver perfil</button>'+(mine?'':'<button class="btn primary" data-act="post-copy" data-id="'+id+'">Copiar treino</button>')+'</div>';
  }});
}
function copyPost(id){
  var p=soc.posts[id];if(!p)return;
  var exs=(p.exercises||[]).map(function(e){
    var known=EX0.some(function(a){return a[0]===e.ex;})||(S.custom||[]).some(function(c){return c.id===e.ex;});
    var exid=e.ex;
    if(!known){
      var same=(S.custom||[]).filter(function(c){return norm(c.name)===norm(e.name);})[0];
      if(same)exid=same.id;else{exid='c'+uid();S.custom.push({id:exid,name:e.name,m:MUSC.indexOf(e.m)>-1?e.m:MUSC[0],e:EQUIP.indexOf(e.e)>-1?e.e:EQUIP[0]});}
    }
    var t=topSet(e.sets)||e.sets[0]||{};
    return {ex:exid,n:Math.max(1,e.sets.length),reps:t.reps||null,kg:t.kg||null};
  });
  S.routines.push({id:uid(),name:p.name,folder:'Copiados',exs:exs});save();
  toast('Copiado para Meus treinos, pasta "Copiados".');
}
function toggleLike(id){
  var was=!!soc.liked[id];
  soc.liked[id]=!was;soc.likes[id]=Math.max(0,(soc.likes[id]||0)+(was?-1:1));updLike(id);
  var q=was?sb.from('likes').delete().eq('user_id',user.id).eq('post_id',id):sb.from('likes').insert({user_id:user.id,post_id:id});
  q.then(function(r){if(r.error&&r.error.code!=='23505')throw r.error;}).catch(function(){soc.liked[id]=was;soc.likes[id]=Math.max(0,(soc.likes[id]||0)+(was?1:-1));updLike(id);toast('Não deu para curtir agora.');});
}

/* Meu perfil social (aba Perfil) */
function mySocHTML(){

var inst={evt:null};
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}}
function platform(){
  var ua=navigator.userAgent||'',ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),android=/android/i.test(ua);
  return {ios:ios,android:android,mobile:ios||android||/mobile/i.test(ua),iosOther:ios&&/crios|fxios|edgios/i.test(ua)};
}
function installHidden(){try{return Date.now()-(+localStorage.getItem('engefit.instHide')||0)<7*864e5;}catch(e){return false;}}
function canOfferInstall(){return !isStandalone()&&(platform().mobile||!!inst.evt);}
function drawInstall(){

  el.innerHTML='<div class="instbar" role="region" aria-label="Instalar o app"><img src="/icons/icon-192.png" alt="" width="40" height="40"><div><b>Instale o ENGEFIT</b><small>'+(inst.evt?'Abra pela tela inicial, em tela cheia, até sem internet.':'Coloque o app na tela inicial em poucos toques.')+'</small></div><button class="btn sm primary" data-act="install">Instalar</button><button class="x" data-act="install-hide" aria-label="Agora não">×</button></div>';

  if(inst.evt){var e=inst.evt;inst.evt=null;try{e.prompt();e.userChoice.then(drawInstall,drawInstall);}catch(x){installHelp();}drawInstall();return;}

  else if(pl.android)steps=['Toque no menu <b>⋮</b> do navegador, no canto superior direito.','Toque em <b>Instalar app</b> ou em <b>Adicionar à tela inicial</b>.','Confirme em <b>Instalar</b>. Se a opção não aparecer, abra engefit.vercel.app no <b>Chrome</b>.'];

}

function bucketWeeks(n){
  var base=weekStart(Date.now()),out=[];
  for(var k=n-1;k>=0;k--){var d=new Date(base);d.setDate(d.getDate()-7*k);out.push({s:d.getTime(),l:pad(d.getDate())+'/'+pad(d.getMonth()+1),n:0,vol:0});}
  S.workouts.forEach(function(w){for(var i=out.length-1;i>=0;i--){if(w.start>=out[i].s){out[i].n++;out[i].vol+=wkStats(w).vol;break;}}});
  return out;
}

function calcP(){
  var t=parseFloat(($('#tpk').value||'').replace(',','.')),o=$('#tpout');
  if(!(t>0)){o.innerHTML='<p class="note">Informe a carga total.</p>';return;}
  if(t<20){o.innerHTML='<p class="note">A carga alvo é menor que a barra de 20 kg.</p>';return;}
  var side=(t-20)/2,pl=[25,20,15,10,5,2.5,1.25],res=[];
  pl.forEach(function(p){var c=Math.floor(side/p+1e-9);if(c>0){res.push(c+' × '+num(p,2)+' kg');side-=c*p;}});
  o.innerHTML='<div class="tile"><span class="lbl">Por lado</span><b style="font-size:18px;line-height:1.4">'+(res.join(' + ')||'Só a barra')+'</b>'+(side>0.01?'<small>Faltam '+num(side*2,2)+' kg para fechar a carga com estas anilhas.</small>':'')+'</div>';
}

 'body-add':function(){var d=$('#bd').value;if(!d){toast('Informe a data.');return;}
   var rec={d:d},n=0,bad='',alt=pnum($('#bm-alt').value);
   if(alt!=null&&(alt<100||alt>250))bad='Altura';
   var kg=toKg($('#bw').value);if(kg>0){if(kg<25||kg>350)bad=bad||'Peso';rec.kg=kg;n++;}
   MED.forEach(function(m){var v=pnum($('#bm-'+m[0]).value);if(v!=null){if(v<m[3]||v>m[4])bad=bad||m[1];rec[m[0]]=v;n++;}});
   if(bad){toast(bad+': confira o valor.');return;}
   var altCh=alt!=null&&alt!==+S.settings.altura;
   if(!n&&!altCh){toast('Preencha pelo menos uma medida.');return;}
   if(altCh)S.settings.altura=alt;
   if(n){var old=S.body.filter(function(x){return x.d===d;})[0]||{};S.body=S.body.filter(function(x){return x.d!==d;});S.body.push(Object.assign({},old,rec));}
   save();syncAvatar();render();toast('Medidas registradas.');},

 'copy-data':function(){
   var txt=JSON.stringify(S);
   var fallback=function(){pushModal({title:'Backup',html:function(){return head('Backup dos dados')+'<p class="note" style="margin-bottom:8px">Selecione e copie o texto abaixo.</p><textarea class="big" id="bk" readonly>'+esc(txt)+'</textarea><div class="row end"><button class="btn primary" data-act="modal-close">Fechar</button></div>';},mount:function(){var t=$('#bk');if(t){t.focus();t.select();}}});};
   try{navigator.clipboard.writeText(txt).then(function(){toast('Backup copiado.');},fallback);}catch(e){fallback();}
 },
 'import-data':function(){
   var txt='';
   pushModal({title:'Restaurar backup',html:function(){return head('Restaurar backup')+'<p class="note" style="margin-bottom:8px">Cole o backup copiado anteriormente. Isto substitui os dados atuais.</p><textarea class="big" id="bk" data-b="txt" aria-label="Texto do backup"></textarea><div class="row end"><button class="btn ghost" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="imp-ok">Restaurar</button></div>';},
     input:function(t){if(t.dataset.b==='txt')txt=t.value;},
     act:function(a){if(a==='imp-ok'){try{var o=JSON.parse(txt);if(!o||!Array.isArray(o.workouts))throw 0;S=normalize(o);S.pendingWipe=true;S.pendingDel=[];S.pendingPosts=S.workouts.map(function(w){return w.id;});save();flushPosts();stack=[];drawModal();render();toast('Backup restaurado.');}catch(e){toast('Texto de backup inválido.');}return true;}return false;}});
 }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(el.closest('#modal')){
    if(a==='modal-close'){popModal();return;}
    var m=stack[stack.length-1];if(m&&m.act&&m.act(a,el,e)===true)return;
  }
  if(ACT[a])ACT[a](el,e);
});
function onInput(t){
  var b=t.dataset.bind;if(!b)return;
  if(b==='kg'||b==='reps'){
    var r=t.closest('.set');if(!r||!S.active)return;
    var s=S.active.exs[+r.dataset.i].sets[+r.dataset.j];
    s[b]=b==='kg'?toKg(t.value):(parseInt(t.value,10)>0?parseInt(t.value,10):null);
    save();updTotals();
  }else if(b==='wname'){S.active.name=t.value;save();}
  else if(b==='note'){S.active.exs[+t.closest('[data-i]').dataset.i].note=t.value;save();}
  else if(b==='exq'){ui.exq=t.value;refreshEx();}
  else if(b==='exe'){ui.exe=t.value;refreshEx();}
  else if(b==='name'){S.settings.name=t.value.trim()||'Atleta';save();if(soc.prof){clearTimeout(pnTimer);pnTimer=setTimeout(function(){profUpdate({name:S.settings.name.slice(0,60)}).catch(function(){});},900);}}
  else if(b==='libn'){ui.libN=t.value;render();}
  else if(b==='pq'){ui.pq=t.value;clearTimeout(ptimer);ptimer=setTimeout(loadPeopleList,300);}
  else if(b==='rest'){S.settings.rest=+t.value;save();}
  else if(b==='t1')calc1();
  else if(b==='tp')calcP();
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.closest('#modal')){var m=stack[stack.length-1];if(m&&m.input)m.input(t);return;}
  onInput(t);
});
document.addEventListener('change',function(e){var t=e.target;if(t.closest('#modal')){var m=stack[stack.length-1];if(m&&m.input)m.input(t);return;}if(t.tagName==='SELECT')onInput(t);if(t.dataset&&t.dataset.check==='priv')setPriv(t);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&stack.length)popModal();});

boot();
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}catch(e){}
})();
