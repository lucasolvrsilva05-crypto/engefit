<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENGEFIT</title>
<meta name="description" content="Registre treinos, acompanhe cargas e evolua com dados.">
<meta name="theme-color" content="#13202b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENGEFIT">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral com navegação + coluna única de trabalho; abas fixas no rodapé em telas estreitas. Estética de prancha técnica. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface2:#e8ecf0; --ink:#13202b; --muted:#566675; --line:#d3dbe2; --grid:rgba(19,32,43,.055);
  --accent:#d1430f; --accent-ink:#ffffff; --blue:#1f5fbf; --good:#1a7f45; --bad:#bb3326;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --tabh:60px; --side:224px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e151b; --surface:#16202a; --surface2:#1f2c38; --ink:#e7edf2; --muted:#93a3b1; --line:#2a3947; --grid:rgba(255,255,255,.045);
    --accent:#ff7a45; --accent-ink:#1d0d05; --blue:#6aa5ff; --good:#4cc380; --bad:#ff7d6e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#16202a; --surface2:#1f2c38; --ink:#e7edf2; --muted:#93a3b1; --line:#2a3947; --grid:rgba(255,255,255,.045);
  --accent:#ff7a45; --accent-ink:#1d0d05; --blue:#6aa5ff; --good:#4cc380; --bad:#ff7d6e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:22px}
h3{font-size:19px}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Estrutura */
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;z-index:5}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none}
.logo svg{width:44px;height:28px;color:var(--accent)}
.logo b{font-family:var(--display);font-size:28px;letter-spacing:.04em}
.logo b i{font-style:normal;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a svg{width:22px;height:22px;flex:none}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--surface)}
.side .foot{margin-top:auto;font:500 11px/1.4 var(--mono);color:var(--muted);padding:0 8px}
.main{margin-left:var(--side);flex:1;min-width:0;padding:0 24px 140px}
.wrap{max-width:860px;margin:0 auto}
.tabs{display:none}

/* Cabeçalho de página */
.ph{margin:0 -24px 22px;padding:30px 24px 22px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border-bottom:1px solid var(--line)}
.ph .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* Componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.sec{margin-top:28px}
.sec>.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tag{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.lbl{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile b{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px;margin-bottom:12px}
input[type=text],input[type=search],input[type=date],input:not([type]),input[inputmode],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.note{font-size:13px;color:var(--muted)}
.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--muted);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px;color:var(--muted)}

/* Feed */
.post{display:flex;flex-direction:column;gap:12px}
.post .who{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 16px var(--display);flex:none;border:1px solid var(--line)}
.av.me{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.post .who small{display:block;color:var(--muted);font-size:12px}
.pstats{display:flex;gap:22px;flex-wrap:wrap}
.pstats div{display:flex;flex-direction:column;gap:2px}
.pstats b{font:600 17px var(--mono)}
.plist{display:flex;flex-direction:column;gap:4px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.plist div{display:flex;justify-content:space-between;gap:12px}
.plist span:last-child{color:var(--muted);font-family:var(--mono);font-size:13px;white-space:nowrap}
.pact{display:flex;gap:8px;flex-wrap:wrap}

/* Treino ativo */
.wkhead{position:sticky;top:0;z-index:4;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.wname{font:700 26px var(--display);border:0;background:transparent;padding:4px 0;min-height:0;width:100%;border-radius:0;border-bottom:1px dashed var(--line)}
.wkstats{display:flex;gap:26px;margin:10px 0 12px;flex-wrap:wrap}
.wkstats div{display:flex;flex-direction:column;gap:3px}
.wkstats b{font:600 20px var(--mono)}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.excard header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.excard header h3{color:var(--blue)}
.exnote{border:0;background:transparent;padding:4px 0;min-height:0;font-size:14px;margin-bottom:6px;border-radius:0;border-bottom:1px dashed var(--line);width:100%}
.sethead,.set{display:grid;grid-template-columns:38px minmax(54px,1fr) minmax(0,1.1fr) minmax(0,1.1fr) 42px 28px;gap:8px;align-items:center}
.sethead{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 0 6px;text-align:center}
.set{padding:5px 0;border-radius:8px}
.set.done{background:color-mix(in srgb,var(--good) 14%,transparent)}
.set .prev{color:var(--muted);font-size:13px;text-align:center;white-space:nowrap}
.set input.num{text-align:center;font:600 16px var(--mono);padding:7px 4px;min-height:40px}
.stype{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font:600 14px var(--mono)}
.stype.t-W{color:#a96a00;border-color:#a96a00}
.stype.t-D{color:var(--blue);border-color:var(--blue)}
.stype.t-F{color:var(--bad);border-color:var(--bad)}
.chk{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:20px;height:20px}
.set.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.x{width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;border-radius:6px}
.x:hover{color:var(--bad);background:var(--surface2)}
.exmenu{display:flex;gap:2px}

/* Treinos */
.rt h3{margin-bottom:2px}
.rt p{color:var(--muted);font-size:14px}
.rt .meta{font:500 12px var(--mono);color:var(--muted);margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.folder{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.folder::after{content:"";flex:1;height:1px;background:var(--line)}

/* Exercícios */
.exlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.exitem{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;align-items:center}
.exitem:last-child{border-bottom:0}
.exitem:hover{background:var(--surface2)}
.exitem .exname{font-weight:600}
.exitem .exmeta{color:var(--muted);font-size:13px;grid-column:1}
.exitem .exsess{grid-column:2;grid-row:1/3;color:var(--muted);font-size:12px;text-align:right}
.exitem.sel{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.filters{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:12px}

/* Gráficos */
svg.ch{width:100%;height:auto;display:block}
.ch .g{stroke:var(--line);stroke-width:1}
.ch .ln{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch .ar{fill:var(--accent);opacity:.13}
.ch .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch .tx{fill:var(--muted);font:11px var(--mono)}
.ch .tv{fill:var(--ink);font:600 12px var(--mono)}
.ch .bar{fill:var(--blue)}
.mrow{display:grid;grid-template-columns:100px 1fr 38px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.mrow .tr{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.mrow .tr i{display:block;height:100%;background:var(--blue);border-radius:5px}
.mrow b{font:600 13px var(--mono);text-align:right}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dw{font:500 11px var(--mono);color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:4px}
.cal button{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:500 14px var(--mono);position:relative;padding:0}
.cal button.has{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal button.sel{outline:2px solid var(--blue);outline-offset:1px}
.cal .blank{visibility:hidden}

/* Doca inferior, modal, toast */
#dock{position:fixed;left:var(--side);right:0;bottom:0;z-index:6;display:flex;flex-direction:column;gap:8px;padding:0 16px 12px;pointer-events:none}
#dock>*{pointer-events:auto;max-width:860px;width:100%;margin:0 auto}
.mini{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:600}
.mini .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
.mini b{margin-left:auto;font-family:var(--mono)}
.mini .go{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:4px 10px;font-size:13px}
@keyframes pulse{50%{opacity:.35}}
.restbar{background:var(--surface);border:1px solid var(--ink);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);position:relative;overflow:hidden}
.restbar[hidden]{display:none}
.restbar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.restbar .t{font:600 22px var(--mono);min-width:64px}
.restbar .sp{flex:1;font-size:13px;color:var(--muted)}
#modal{position:fixed;inset:0;z-index:20;display:none}
#modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,14,20,.55)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.rrow{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;margin-bottom:10px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.rin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rin label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.rin input{text-align:center;font-family:var(--mono);font-weight:600}
.pklist{max-height:46vh;overflow:auto;margin:12px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.lock{overflow:hidden}
.pr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.table th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.table td.n{font-family:var(--mono);text-align:right}
textarea.big{min-height:160px;font:12px/1.4 var(--mono)}

@media (max-width:860px){
  .side{display:none}
  .main{margin-left:0;padding:0 16px 150px}
  .ph{margin:0 -16px 18px;padding:22px 16px 18px}
  h1{font-size:30px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;height:var(--tabh);background:var(--surface);border-top:1px solid var(--line);z-index:7}
  .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
  .tabs a svg{width:22px;height:22px}
  .tabs a.on{color:var(--accent)}
  #dock{left:0;bottom:calc(var(--tabh) + 8px);padding:0 12px}
  #toast{bottom:150px}
  .filters{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .sheet{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:92%;border-radius:16px 16px 0 0}
  .wkstats{gap:18px}
  .tile b{font-size:21px}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navegação principal">
    <a class="logo" href="#inicio" aria-label="ENGEFIT, início">
      <svg viewBox="0 0 44 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 8v12M9 5v18M35 5v18M40 8v12M9 14h26"/></svg>
      <b>ENGE<i>FIT</i></b>
    </a>
    <nav class="nav" id="navside"></nav>
    <div class="foot">Registre. Meça.<br>Progrida com carga.</div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<nav class="tabs" id="navtabs" aria-label="Navegação principal"></nav>
<div id="dock"><div id="restbar" hidden></div><div id="mini" style="display:contents"></div></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ====== Dados base ====== */
var LB=2.2046226;
var MUSC=['Peito','Costas','Ombros','Bíceps','Tríceps','Quadríceps','Posteriores','Glúteos','Panturrilhas','Abdômen'];
var EQUIP=['Barra','Halter','Máquina','Cabo','Peso do corpo'];
var EX0=[
['supino-reto-barra','Supino reto com barra','Peito','Barra'],
['supino-reto-halter','Supino reto com halteres','Peito','Halter'],
['supino-inclinado-halter','Supino inclinado com halteres','Peito','Halter'],
['supino-maquina','Supino na máquina','Peito','Máquina'],
['crucifixo-maquina','Crucifixo na máquina (peck deck)','Peito','Máquina'],
['crossover','Crossover na polia','Peito','Cabo'],
['flexao','Flexão de braços','Peito','Peso do corpo'],
['puxada-frontal','Puxada frontal','Costas','Cabo'],
['remada-curvada','Remada curvada com barra','Costas','Barra'],
['remada-baixa','Remada baixa','Costas','Cabo'],
['remada-unilateral','Remada unilateral com halter','Costas','Halter'],
['barra-fixa','Barra fixa','Costas','Peso do corpo'],
['levantamento-terra','Levantamento terra','Costas','Barra'],
['pulldown-braco-reto','Pulldown com braços retos','Costas','Cabo'],
['desenv-halter','Desenvolvimento com halteres','Ombros','Halter'],
['desenv-barra','Desenvolvimento com barra','Ombros','Barra'],
['elev-lateral','Elevação lateral','Ombros','Halter'],
['elev-lateral-cabo','Elevação lateral na polia','Ombros','Cabo'],
['crucifixo-inverso','Crucifixo inverso na máquina','Ombros','Máquina'],
['face-pull','Face pull','Ombros','Cabo'],
['rosca-direta','Rosca direta com barra','Bíceps','Barra'],
['rosca-alternada','Rosca alternada com halteres','Bíceps','Halter'],
['rosca-martelo','Rosca martelo','Bíceps','Halter'],
['rosca-scott','Rosca Scott na máquina','Bíceps','Máquina'],
['rosca-cabo','Rosca na polia','Bíceps','Cabo'],

var norm=function(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();};
var pad=function(n){return String(n).padStart(2,'0');};
var dkey=function(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var rm=function(kg,reps){return reps<=1?kg:kg*(1+reps/30);};
var num=function(v,dig){return Number(v).toLocaleString('pt-BR',{maximumFractionDigits:dig==null?1:dig});};
function unit(){return S.settings.unit;}
function conv(kg){return unit()==='lb'?kg*LB:kg;}
function dispKg(kg){if(kg==null||kg==='')return '';return String(Math.round(conv(kg)*10)/10).replace('.',',');}
function toKg(str){var n=parseFloat(String(str).replace(',','.'));if(isNaN(n)||n<0)return null;return Math.round((unit()==='lb'?n/LB:n)*1000)/1000;}
function fmtW(kg){return kg===0?'PC':dispKg(kg)+' '+unit();}
function fmtVol(kg){return num(conv(kg),0)+' '+unit();}
function clock(sec){sec=Math.max(0,sec|0);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):pad(m))+':'+pad(s);}
function fmtDur(sec){var m=Math.round(sec/60);return m>=60?Math.floor(m/60)+' h '+pad(m%60)+' min':m+' min';}
function fmtDate(ts){return new Date(ts).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});}
function relTime(ts){var m=Math.round((Date.now()-ts)/60000);if(m<60)return 'há '+Math.max(1,m)+' min';var h=Math.round(m/60);if(h<24)return 'há '+h+' h';var d=Math.round(h/24);return d===1?'ontem':'há '+d+' dias';}
function exById(id){var a=EX0.filter(function(x){return x[0]===id;})[0];if(a)return {id:a[0],name:a[1],m:a[2],e:a[3]};var c=(S.custom||[]).filter(function(x){return x.id===id;})[0];return c||{id:id,name:id,m:'—',e:'—'};}

function rng(seed){return function(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;};}
function seed(){
  var r=rng(42),now=new Date(),out=blank();out.demo=true;
  var T={
    push:['Push A',[['supino-reto-barra',60,8],['supino-inclinado-halter',22,10],['desenv-halter',18,10],['elev-lateral',8,12],['triceps-corda',25,12]]],

    legs:['Legs A',[['agachamento',70,8],['leg-press',140,10],['stiff',60,10],['cadeira-extensora',45,12],['panturrilha-pe',60,15]]]
  };
  var seq=['push','pull','legs','push'],days=[1,2,4,6],i=0;
  var sun=new Date(now);sun.setHours(7,30,0,0);sun.setDate(sun.getDate()-sun.getDay());
  for(var w=9;w>=0;w--){
    for(var k=0;k<4;k++){
      var d=new Date(sun);d.setDate(d.getDate()-w*7+days[k]);d.setMinutes(d.getMinutes()+Math.floor(r()*50));
      if(d.getTime()>Date.now()-6*3600e3)continue;
      if(r()<0.12)continue;
      var t=T[seq[k]],f=1+(9-w)*0.017,exs=[];
      t[1].forEach(function(e,idx){
        var kg=Math.round(e[1]*f/1.25)*1.25,n=idx===0?4:3,sets=[];
        for(var s=0;s<n;s++)sets.push({t:'N',kg:kg,reps:Math.max(5,e[2]-(s>1?Math.floor(r()*3):0)),done:true});
        exs.push({ex:e[0],note:'',sets:sets});
      });
      out.workouts.push({id:'w'+(i++),name:t[0],start:d.getTime(),dur:Math.round(3000+r()*1500),exs:exs,prs:0,demo:true});
    }
  }
  for(var b=9;b>=0;b--){var bd=new Date(sun);bd.setDate(bd.getDate()-b*7);out.body.push({d:dkey(bd.getTime()),kg:Math.round((82.6-(9-b)*0.18+(r()-.5)*.5)*10)/10,demo:true});}
  var last={};out.workouts.forEach(function(w){w.exs.forEach(function(e){last[e.ex]=e.sets[0].kg;});});
  [['push','PPL'],['pull','PPL'],['legs','PPL']].forEach(function(a,n){
    out.routines.push({id:'r'+n,name:T[a[0]][0],folder:a[1],exs:T[a[0]][1].map(function(e){return {ex:e[0],n:e[0]==='supino-reto-barra'||e[0]==='agachamento'?4:3,reps:e[2],kg:last[e[0]]||e[1]};})});
  });
  return out;
}

function exHist(id){
  var out=[];
  S.workouts.slice().sort(function(a,b){return a.start-b.start;}).forEach(function(w){
    w.exs.forEach(function(e){
      if(e.ex!==id)return;
      var ss=e.sets.filter(function(s){return s.done&&s.t!=='W'&&s.reps>0;});
      if(!ss.length)return;
      out.push({w:w,sets:e.sets.filter(function(s){return s.done;}),top:Math.max.apply(null,ss.map(function(s){return s.kg||0;})),rm:Math.max.apply(null,ss.map(function(s){return rm(s.kg||0,s.reps);})),vol:ss.reduce(function(a,s){return a+(s.kg||0)*s.reps;},0)});
    });
  });
  return out;
}
function prevSets(id){var h=exHist(id);return h.length?h[h.length-1].sets:[];}
function setVol(s){return (s.t==='W'||!s.done)?0:(s.kg||0)*(s.reps||0);}
function wkStats(w){var v=0,n=0;w.exs.forEach(function(e){e.sets.forEach(function(s){if(s.done){n++;v+=setVol(s);}});});return {vol:v,sets:n};}
function sessionCounts(){var c={};S.workouts.forEach(function(w){w.exs.forEach(function(e){c[e.ex]=(c[e.ex]||0)+1;});});return c;}

function sortedW(){return S.workouts.slice().sort(function(a,b){return b.start-a.start;});}

/* ====== Gráficos ====== */
function lineChart(pts,fmt){
  if(!pts.length)return '<p class="empty">Sem dados para este gráfico.</p>';
  var W=600,H=220,pl=48,pr=18,pt=22,pb=28;
  var mn=Math.min.apply(null,pts.map(function(p){return p.v;})),mx=Math.max.apply(null,pts.map(function(p){return p.v;}));
  if(mn===mx){mn-=1;mx+=1;}
  var p10=(mx-mn)*0.12;mn-=p10;mx+=p10;
  var X=function(i){return pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1));};
  var Y=function(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);};
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de linha com '+pts.length+' pontos">';
  for(var k=0;k<4;k++){var val=mn+(mx-mn)*k/3,y=Y(val);s+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="tx" x="'+(pl-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+fmt(val)+'</text>';}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' ');
  s+='<path class="ar" d="'+d+' L'+X(pts.length-1).toFixed(1)+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z"/><path class="ln" d="'+d+'"/>';
  var idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter(function(v,i,a){return a.indexOf(v)===i;});
  idx.forEach(function(i){s+='<text class="tx" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0&&pts.length>1?'start':i===pts.length-1&&pts.length>1?'end':'middle')+'">'+esc(pts[i].l)+'</text>';});
  var li=pts.length-1,ly=Y(pts[li].v);
  s+='<circle class="pt" cx="'+X(li).toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5"/><text class="tv" x="'+X(li).toFixed(1)+'" y="'+(ly<pt+8?ly+20:ly-10).toFixed(1)+'" text-anchor="end">'+fmt(pts[li].v)+'</text></svg>';
  return s;
}
function barChart(items){
  var W=600,H=190,pl=12,pr=12,pt=22,pb=28,n=items.length;
  var mx=Math.max.apply(null,items.map(function(i){return i.v;}).concat([1]));
  var slot=(W-pl-pr)/n,bw=Math.min(40,slot*0.6);
  var s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de barras semanal"><line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  items.forEach(function(it,i){
    var h=(H-pt-pb)*it.v/mx,x=pl+slot*i+(slot-bw)/2,y=H-pb-h;
    if(it.v>0)s+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/><text class="tv" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+it.v+'</text>';
    if(n<=8||i%2===(n-1)%2)s+='<text class="tx" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(it.l)+'</text>';
  });
  return s+'</svg>';
}

var stack=[];

  var el=$('#modal');

  var m=stack[stack.length-1];
  el.innerHTML='<div class="backdrop" data-act="modal-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(m.title)+'" tabindex="-1">'+m.html()+'</div>';

}

        b='<div class="kv"><div class="tile"><span class="lbl">Maior carga</span><b>'+fmtW(top)+'</b></div><div class="tile"><span class="lbl">1RM estimado</span><b>'+fmtW(r1)+'</b></div><div class="tile"><span class="lbl">Sessões</span><b>'+h.length+'</b></div><div class="tile"><span class="lbl">Volume total</span><b>'+fmtVol(tv)+'</b></div></div>'+
        (rr.length?'<table class="table"><thead><tr><th>Repetições</th><th style="text-align:right">Melhor carga</th></tr></thead><tbody>'+rr.map(function(n){return '<tr><td>'+n+' rep'+(n>1?'s':'')+'</td><td class="n">'+fmtW(recs[n])+'</td></tr>';}).join('')+'</tbody></table>':'');
      }else if(tab==='gra'){
        var labs={top:'Carga máxima',rm:'1RM estimado',vol:'Volume da sessão'};
        var pts=h.map(function(s){var dd=new Date(s.w.start);return {l:pad(dd.getDate())+'/'+pad(dd.getMonth()+1),v:conv(s[met])};});
        b='<div class="seg" style="margin-bottom:10px">'+Object.keys(labs).map(function(k){return '<button data-act="ed-met" data-v="'+k+'" class="'+(met===k?'on':'')+'">'+labs[k]+'</button>';}).join('')+'</div>'+lineChart(pts,function(v){return met==='vol'?num(v,0):num(v,1);})+'<p class="note">Valores em '+unit()+(met==='rm'?'. Estimativa pela fórmula de Epley.':'.')+'</p>';
      }else{
        b=h.slice().reverse().slice(0,30).map(function(s){return '<div class="pr"><span>'+fmtDate(s.w.start)+'</span><span class="mono" style="font-size:13px;text-align:right">'+s.sets.map(function(st){return (st.t==='W'?'W ':'')+dispKg(st.kg)+'×'+st.reps;}).join(' · ')+'</span></div>';}).join('');
      }
      return head(x.name)+'<p class="note" style="margin:-8px 0 14px">'+esc(x.m)+' · '+esc(x.e)+'</p>'+tabs+b;
    },
    act:function(a,el){if(a==='ed-tab'){tab=el.dataset.v;drawModal();return true;}if(a==='ed-met'){met=el.dataset.v;drawModal();return true;}return false;}});
}

/* ====== Treino ativo ====== */
function elapsed(){return S.active?Math.floor((Date.now()-S.active.start)/1000):0;}
function startWorkout(rt){
  if(S.active){toast('Finalize ou descarte o treino atual primeiro.');go('treino');return;}
  var hr=new Date().getHours(),per=hr<12?'da manhã':hr<18?'da tarde':'da noite';
  var A={id:uid(),name:rt?rt.name:'Treino '+per,start:Date.now(),rid:rt?rt.id:null,exs:[]};
  if(rt)rt.exs.forEach(function(r){var sets=[];for(var i=0;i<r.n;i++)sets.push({t:'N',kg:r.kg==null?null:r.kg,reps:r.reps==null?null:r.reps,done:false});A.exs.push({ex:r.ex,note:'',sets:sets});});
  S.active=A;save();go('treino');
}
function addExToActive(ids){ids.forEach(function(id){var ps=prevSets(id);S.active.exs.push({ex:id,note:'',sets:[{t:'N',kg:null,reps:null,done:false}]});});save();render();}
function totalsActive(){var v=0,n=0;S.active.exs.forEach(function(e){e.sets.forEach(function(s){if(s.done){n++;v+=setVol(s);}});});return {vol:v,sets:n};}
function updTotals(){var t=totalsActive(),a=$('#wvol'),b=$('#wsets');if(a)a.textContent=fmtVol(t.vol);if(b)b.textContent=t.sets;}
var chkSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function setRow(e,i,j,ps){
  var s=e.sets[j],p=ps[j],n=0;
  for(var k=0;k<=j;k++)if(e.sets[k].t==='N')n++;
  var lab=s.t==='N'?n:s.t;
  return '<div class="set'+(s.done?' done':'')+'" data-i="'+i+'" data-j="'+j+'">'+
  '<button class="stype t-'+s.t+'" data-act="set-cycle" aria-label="Tipo da série '+lab+'. Toque para alternar entre normal, aquecimento, drop e falha">'+lab+'</button>'+
  '<span class="prev mono">'+(p?dispKg(p.kg)+'×'+p.reps:'—')+'</span>'+
  '<input class="num" data-bind="kg" inputmode="decimal" aria-label="Carga em '+unit()+'" value="'+dispKg(s.kg)+'" placeholder="'+(p?dispKg(p.kg):'')+'">'+
  '<input class="num" data-bind="reps" inputmode="numeric" aria-label="Repetições" value="'+(s.reps==null?'':s.reps)+'" placeholder="'+(p?p.reps:'')+'">'+
  '<button class="chk" data-act="set-done" aria-pressed="'+s.done+'" aria-label="Concluir série">'+chkSvg+'</button>'+
  '<button class="x" data-act="set-del" aria-label="Remover série">×</button></div>';
}
function vActive(){
  var A=S.active,t=totalsActive();
  var h='<header class="wkhead"><div class="wrap"><label class="lbl" for="wname">Treino em andamento</label><input id="wname" class="wname" data-bind="wname" value="'+esc(A.name)+'" aria-label="Nome do treino"><div class="wkstats"><div><span class="lbl">Duração</span><b id="wclock">'+clock(elapsed())+'</b></div><div><span class="lbl">Volume</span><b id="wvol">'+fmtVol(t.vol)+'</b></div><div><span class="lbl">Séries</span><b id="wsets">'+t.sets+'</b></div></div><div class="row"><button class="btn primary" data-act="finish">Finalizar treino</button><button class="btn ghost" data-act="discard-ask">Descartar</button></div></div></header><div class="wrap">';
  if(!A.exs.length)h+='<p class="empty">Treino vazio. Adicione o primeiro exercício.</p>';
  A.exs.forEach(function(e,i){
    var x=exById(e.ex),ps=prevSets(e.ex);
    h+='<section class="excard" data-i="'+i+'"><header><div><h3>'+esc(x.name)+'</h3><span class="tag">'+esc(x.m)+'</span></div><div class="exmenu"><button class="x" data-act="ex-up" aria-label="Mover exercício para cima">↑</button><button class="x" data-act="ex-del" aria-label="Remover exercício">×</button></div></header><input class="exnote" data-bind="note" placeholder="Adicionar nota" aria-label="Nota do exercício" value="'+esc(e.note||'')+'"><div class="sethead"><span>Série</span><span>Anterior</span><span>'+unit()+'</span><span>Reps</span><span></span><span></span></div>'+e.sets.map(function(_,j){return setRow(e,i,j,ps);}).join('')+'<button class="btn ghost sm block" style="margin-top:8px" data-act="add-set">+ Adicionar série</button></section>';
  });
  return h+'<button class="btn block" data-act="add-ex">+ Adicionar exercício</button></div>';
}
function finish(){
  var A=S.active;
  var exs=A.exs.map(function(e){return {ex:e.ex,note:e.note||'',sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {t:s.t,kg:s.kg||0,reps:s.reps||0,done:true};})};}).filter(function(e){return e.sets.length;});
  if(!exs.length){toast('Marque ao menos uma série como concluída.');return;}
  var prs=[];
  exs.forEach(function(e){
    var h=exHist(e.ex);if(!h.length)return;
    var pk=Math.max.apply(null,h.map(function(x){return x.top;})),pr=Math.max.apply(null,h.map(function(x){return x.rm;}));
    var ss=e.sets.filter(function(s){return s.t!=='W'&&s.reps>0;});if(!ss.length)return;
    var nk=Math.max.apply(null,ss.map(function(s){return s.kg;})),nr=Math.max.apply(null,ss.map(function(s){return rm(s.kg,s.reps);}));
    if(nk>pk+1e-9)prs.push({ex:e.ex,kind:'Maior carga',val:nk});else if(nr>pr+1e-9)prs.push({ex:e.ex,kind:'1RM estimado',val:nr});
  });
  var w={id:A.id,name:(A.name||'').trim()||'Treino',start:A.start,dur:Math.max(60,elapsed()),exs:exs,prs:prs.length};
  S.workouts.push(w);S.active=null;rest=null;save();render();summary(w,prs);
}
function summary(w,prs){
  var st=wkStats(w);
  pushModal({title:'Treino concluído',html:function(){return head('Treino concluído')+'<p style="margin:-6px 0 14px;font-weight:600">'+esc(w.name)+'</p><div class="kv"><div class="tile"><span class="lbl">Duração</span><b>'+fmtDur(w.dur)+'</b></div><div class="tile"><span class="lbl">Volume</span><b>'+fmtVol(st.vol)+'</b></div><div class="tile"><span class="lbl">Séries</span><b>'+st.sets+'</b></div><div class="tile"><span class="lbl">Recordes</span><b>'+prs.length+'</b></div></div>'+(prs.length?'<h3 style="margin-bottom:6px">Novos recordes</h3>'+prs.map(function(p){return '<div class="pr"><span>'+esc(exById(p.ex).name)+'</span><span class="mono">'+p.kind+': '+fmtW(p.val)+'</span></div>';}).join(''):'<p class="note">Nenhum recorde desta vez. Compare com o histórico na aba Exercícios.</p>')+'<div class="row end"><button class="btn primary" data-act="modal-close">Fechar</button></div>';}});
}

/* ====== Tempo de descanso ====== */
function startRest(){var s=S.settings.rest;if(!s)return;rest={end:Date.now()+s*1000,total:s,done:false};drawRest();}
function drawRest(){
  var el=$('#restbar');
  if(!rest||!S.active){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;el.className='restbar';
  el.innerHTML=rest.done?'<span class="t" style="color:var(--good)">Pronto</span><span class="sp">Descanso concluído. Próxima série.</span><button class="btn sm" data-act="rest-skip">Fechar</button>':'<span class="t" id="rt">'+clock(Math.ceil((rest.end-Date.now())/1000))+'</span><span class="sp">Descanso</span><button class="btn sm ghost" data-act="rest-add" data-v="-15" aria-label="Menos 15 segundos">−15</button><button class="btn sm ghost" data-act="rest-add" data-v="15" aria-label="Mais 15 segundos">+15</button><button class="btn sm" data-act="rest-skip">Pular</button><i class="prog" id="rp" style="width:0"></i>';
}
setInterval(function(){
  if(S.active){var c=$('#wclock');if(c)c.textContent=clock(elapsed());var m=$('#minic');if(m)m.textContent=clock(elapsed());}
  if(rest){
    var left=Math.ceil((rest.end-Date.now())/1000);
    if(!rest.done&&left<=0){rest.done=true;rest.hide=Date.now()+5000;try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}drawRest();}
    else if(rest.done&&Date.now()>rest.hide){rest=null;drawRest();}
    else if(!rest.done){var t=$('#rt');if(t)t.textContent=clock(left);var p=$('#rp');if(p)p.style.width=Math.min(100,100*(1-(rest.end-Date.now())/(rest.total*1000)))+'%';}
  }
},500);

function routineEditor(id){
  var src=id?S.routines.filter(function(r){return r.id===id;})[0]:null;
  var d=src?JSON.parse(JSON.stringify(src)):{id:uid(),name:'',folder:'',exs:[]};
  var folders=Array.from(new Set(S.routines.map(function(r){return r.folder;}).filter(Boolean)));

    html:function(){return head(src?'Editar treino':'Novo treino')+'<label class="fl">Nome<input id="rn" data-b="name" value="'+esc(d.name)+'" placeholder="Ex.: Push A"></label><label class="fl">Pasta (opcional)<input id="rf" data-b="folder" list="fl" value="'+esc(d.folder)+'" placeholder="Ex.: PPL"><datalist id="fl">'+folders.map(function(f){return '<option value="'+esc(f)+'">';}).join('')+'</datalist></label><div>'+(d.exs.map(function(r,k){return '<div class="rrow" data-k="'+k+'"><div class="rtop"><b>'+esc(exById(r.ex).name)+'</b><span><button class="x" data-act="r-up" aria-label="Mover para cima">↑</button><button class="x" data-act="r-del" aria-label="Remover exercício">×</button></span></div><div class="rin"><label>Séries<input data-b="n" inputmode="numeric" value="'+r.n+'"></label><label>Reps<input data-b="reps" inputmode="numeric" value="'+(r.reps==null?'':r.reps)+'"></label><label>Carga ('+unit()+')<input data-b="kg" inputmode="decimal" value="'+dispKg(r.kg)+'"></label></div></div>';}).join('')||'<p class="empty">Nenhum exercício ainda.</p>')+'</div><button class="btn block" data-act="r-add">+ Adicionar exercício</button><div class="row end"><button class="btn ghost" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="r-save">Salvar treino</button></div>';},
    input:function(t){var b=t.dataset.b;if(!b)return;var row=t.closest('.rrow');if(!row){d[b]=t.value;return;}var r=d.exs[+row.dataset.k];if(b==='n')r.n=Math.max(1,Math.min(20,parseInt(t.value,10)||1));else if(b==='reps')r.reps=parseInt(t.value,10)||null;else if(b==='kg')r.kg=toKg(t.value);},
    act:function(a,el){
      var row=el.closest('.rrow'),k=row?+row.dataset.k:-1;
      if(a==='r-del'){d.exs.splice(k,1);drawModal();return true;}
      if(a==='r-up'){if(k>0){var t=d.exs[k];d.exs[k]=d.exs[k-1];d.exs[k-1]=t;}drawModal();return true;}
      if(a==='r-add'){openPicker(function(ids){ids.forEach(function(x){d.exs.push({ex:x,n:3,reps:10,kg:null});});drawModal();});return true;}
      if(a==='r-save'){
        if(!d.name.trim()){toast('Dê um nome ao treino.');return true;}
        if(!d.exs.length){toast('Adicione ao menos um exercício.');return true;}
        d.name=d.name.trim();d.folder=(d.folder||'').trim();
        var i=S.routines.findIndex(function(r){return r.id===d.id;});if(i>-1)S.routines[i]=d;else S.routines.push(d);
        save();popModal();render();toast('Treino salvo.');return true;
      }
      return false;
    }});
}

function bucketWeeks(n){
  var base=weekStart(Date.now()),out=[];
  for(var k=n-1;k>=0;k--){var d=new Date(base);d.setDate(d.getDate()-7*k);out.push({s:d.getTime(),l:pad(d.getDate())+'/'+pad(d.getMonth()+1),n:0,vol:0});}
  S.workouts.forEach(function(w){for(var i=out.length-1;i>=0;i--){if(w.start>=out[i].s){out[i].n++;out[i].vol+=wkStats(w).vol;break;}}});
  return out;
}

function calc1(){
  var k=parseFloat(($('#t1k').value||'').replace(',','.')),r=parseInt($('#t1r').value,10),o=$('#t1out');
  if(!(k>0)||!(r>0)){o.innerHTML='<p class="note">Informe carga e repetições.</p>';return;}
  var one=rm(k,r);
  o.innerHTML='<div class="tile" style="margin-bottom:10px"><span class="lbl">1RM estimado</span><b>'+num(one,1)+' '+unit()+'</b></div><table class="table"><thead><tr><th>% do 1RM</th><th style="text-align:right">Carga</th></tr></thead><tbody>'+[95,90,85,80,75,70,65,60].map(function(p){return '<tr><td>'+p+'%</td><td class="n">'+num(one*p/100,1)+' '+unit()+'</td></tr>';}).join('')+'</tbody></table>';
}
function calcP(){
  var t=parseFloat(($('#tpk').value||'').replace(',','.')),o=$('#tpout');
  if(!(t>0)){o.innerHTML='<p class="note">Informe a carga total.</p>';return;}
  if(t<20){o.innerHTML='<p class="note">A carga alvo é menor que a barra de 20 kg.</p>';return;}
  var side=(t-20)/2,pl=[25,20,15,10,5,2.5,1.25],res=[];
  pl.forEach(function(p){var c=Math.floor(side/p+1e-9);if(c>0){res.push(c+' × '+num(p,2)+' kg');side-=c*p;}});
  o.innerHTML='<div class="tile"><span class="lbl">Por lado</span><b style="font-size:18px;line-height:1.4">'+(res.join(' + ')||'Só a barra')+'</b>'+(side>0.01?'<small>Faltam '+num(side*2,2)+' kg para fechar a carga com estas anilhas.</small>':'')+'</div>';
}

  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(el.closest('#modal')){
    if(a==='modal-close'){popModal();return;}
    var m=stack[stack.length-1];if(m&&m.act&&m.act(a,el,e)===true)return;
  }
  if(ACT[a])ACT[a](el,e);
});
function onInput(t){
  var b=t.dataset.bind;if(!b)return;
  if(b==='kg'||b==='reps'){
    var r=t.closest('.set');if(!r||!S.active)return;
    var s=S.active.exs[+r.dataset.i].sets[+r.dataset.j];
    s[b]=b==='kg'?toKg(t.value):(parseInt(t.value,10)>0?parseInt(t.value,10):null);
    save();updTotals();
  }else if(b==='wname'){S.active.name=t.value;save();}
  else if(b==='note'){S.active.exs[+t.closest('[data-i]').dataset.i].note=t.value;save();}
  else if(b==='exq'){ui.exq=t.value;refreshEx();}
  else if(b==='exe'){ui.exe=t.value;refreshEx();}
  else if(b==='name'){S.settings.name=t.value.trim()||'Atleta';save();}
  else if(b==='rest'){S.settings.rest=+t.value;save();}
  else if(b==='t1')calc1();
  else if(b==='tp')calcP();
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.closest('#modal')){var m=stack[stack.length-1];if(m&&m.input)m.input(t);return;}
  onInput(t);
});
document.addEventListener('change',function(e){var t=e.target;if(t.closest('#modal')){var m=stack[stack.length-1];if(m&&m.input)m.input(t);return;}if(t.tagName==='SELECT')onInput(t);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&stack.length)popModal();});

buildNav();route();render();
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}catch(e){}
})();
</script>
